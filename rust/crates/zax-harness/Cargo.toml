[package]
name = "zax-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Mirrors `zax-nes`'s own default, so that `cargo test -p zax-harness` builds the same core the
# crate's own default builds. **Empty since MF-VS step 7 parked `board-vs-system`**: the `vs`
# subcommand is then not in the default build either, which is what a build whose core has no VS
# layer wants.
default = []

# The configuration that turns the parked boards on, `zax-nes`'s `parked-boards` with this
# crate's own `vs` subcommand beside it, so that one flag gives the same machine on both sides.
parked-boards = ["vs-system", "zax-nes/parked-boards"]

# The wgpu renderer (`render --backend vulkan|dx12`), desktop only.
wgpu = ["zax-render/wgpu"]

# `zax-harness vs`, the command that drives a VS. System cabinet (lot MF-VS step 6). It needs the
# core's own `board-vs-system`, and Cargo cannot see a dependency's feature from here, so the
# command is behind this pass-through: with it off the subcommand does not exist, which is what a
# build whose core has no VS layer wants. `docs/review/BOARD-FEATURES.md` has the switch.
vs-system = ["zax-nes/board-vs-system"]

# `zax-harness fceux-run` and `fceux-compare`, the FCEUX engine's two commands (lot FCEUX-1
# step 4). Off by default like everything of that engine: with it off `zax-fceux` is not a
# dependency at all, no C is linked, and the binary is the one it always was. On, it needs the
# fork `cleanroom/fceux-zax` built first - `zax-fceux/build.rs` says how.
fceux-core = ["dep:zax-fceux", "zax-fceux/fceux-core"]

# The core's exact sprite-evaluation pipeline (lot MF-4e step 3), out of `default` because it is
# above the owner's tolerance on both runs. A pass-through for the same reason `vs-system` is one:
# Cargo cannot see a dependency's feature from a test, and
# `req_core_110_accuracy_coin_keeps_the_rows_mf_4b_to_mf_4e_turned_green` has to know which
# configuration it is scoring — 128 / 147 with neither of the two PPU features, 131 / 147 with
# this one alone.
ppu-exact-sprite-eval = ["zax-nes/ppu-exact-sprite-eval"]

# The core's `$2007`-during-rendering rule (lot MF-4e step 2), out of `default` since lot
# MF-4e-gate — not for a figure but because R0 validates by eye what it changes in Super Mario
# Bros. 3 and Zelda II first. A pass-through for the same reason the two above are:
# `req_core_110_accuracy_coin_keeps_the_rows_mf_4b_to_mf_4e_turned_green` has to know which
# configuration it is scoring, and this feature is worth exactly one row of it.
ppu-2007-render-read = ["zax-nes/ppu-2007-render-read"]

[dependencies]
serde_json.workspace = true
zax-core-api = { path = "../zax-core-api" }
sha2 = "0.10"
# `.bk2` movies (lot EVAL-SYNC step 4): a zip of text files, whose header states a SHA-1.
# Both are already `zax-app`'s own dependencies at these versions, so this adds nothing to the
# lock file and nothing to fetch.
sha1 = { version = "0.11.0", default-features = false }
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
zax-engine3d = { path = "../zax-engine3d" }
zax-fceux = { path = "../zax-fceux", optional = true }
zax-nes = { path = "../zax-nes" }
zax-profiles = { path = "../zax-profiles" }
zax-render = { path = "../zax-render", features = ["offscreen"] }
zax-scripting = { path = "../zax-scripting" }
zax-settings = { path = "../zax-settings" }

[dev-dependencies]
zax-goldens = { path = "../zax-goldens" }

[lints]
workspace = true
