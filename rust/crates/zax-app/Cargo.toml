[package]
name = "zax-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "zaxnes"
path = "src/main.rs"

[features]
# The platform's own file dialog (Windows Explorer, the XDG portal on Linux) in place of the
# ImGui browser; the browser stays as the fallback at run time.
default = ["native-dialog"]
native-dialog = ["dep:rfd"]
# Statically links SDL2 (Windows, aarch64); forwarded to zax-platform.
bundled = ["zax-platform/bundled"]
# Links the firmware's libSDL2-2.0.so.0 dynamically (handhelds); forwarded to zax-platform.
firmware-sdl = ["zax-platform/firmware-sdl"]
# Android: SDL2 built from source as a shared library, shipped in the APK next to the app's
# (`libSDL2.so`, which holds SDL's Java bindings); forwarded to zax-platform.
android = ["zax-platform/android"]
# The Vulkan and DirectX 12 renderer (`video.backend`, `--backend`), desktop only: the handheld
# package never turns it on.
wgpu = ["dep:wgpu", "zax-render/wgpu", "zax-platform/wgpu"]
# FCEUX as a second emulation engine, chosen per game (`emu.engine`); lot FCEUX-23. **Off by
# default**: with it off `zax-fceux` is not a dependency at all, no C is linked, the engine row is
# not shown and the per-game value is read and written without error but ignored — the binary is
# the one it always was. On, it needs the fork `cleanroom/fceux-zax` built first
# (`zax-fceux/build.rs` says how), and shipping it carries the licence duty of §10 of
# `docs/review/FCEUX-ENGINE.md`.
fceux-core = ["dep:zax-fceux", "zax-fceux/fceux-core"]

[dependencies]
zax-core-api = { path = "../zax-core-api" }
zax-fceux = { path = "../zax-fceux", optional = true }
# The NesHawk port: safe Rust, no feature gate, so the engine row is a real choice in every
# build (lot NESHAWK-REWRITE).
zax-neshawk = { path = "../zax-neshawk" }
zax-nes = { path = "../zax-nes" }
zax-settings = { path = "../zax-settings" }
zax-profiles = { path = "../zax-profiles" }
zax-scripting = { path = "../zax-scripting" }
zax-engine3d = { path = "../zax-engine3d" }
zax-render = { path = "../zax-render" }
zax-platform = { path = "../zax-platform" }
zax-achievements = { path = "../zax-achievements" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
sha1 = { version = "0.11.0", default-features = false }
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
sdl2 = "0.38"
glow = "0.16"
wgpu = { version = "29.0.4", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "vulkan",
    "wgsl",
] }
sys-locale = "0.3.2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }
imgui = { version = "0.12", features = ["tables-api"] }
jpeg-encoder = "0.7"
png = "0.17"

[dev-dependencies]
rstest = "0.26"
walkdir = "2"
