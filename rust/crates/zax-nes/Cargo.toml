# `board-namcot108`.
#
# The registers are the board's decode of $6000-$7FFF, so `board_memory_sizes` gives the number
# `prg_ram: Some(0)` -- mappers 114, 115 and 182's row. The page's "no games are known to rely on
# changing mirroring at run-time" is a note about the catalogue and not about the register, so
# $6004 is implemented and tested (Q-161).
board-193 = ["board-namcot108"]

# NES 2.0 mapper 298 (MF-UNL-7 step 4): the unlicensed *Lethal Weapon*, a backport of Konami's
# *Lethal Enforcers* and not the licensed game of that name.
#
# Its page gives no register list, because it needs none: "The board uses a VRC4 clone in the VRC4b
# configuration (CPU 0x02s to VRC4 A0, CPU 0x01s to VRC4 A1)" -- which is `VrcVariant::Vrc4b`
# exactly -- and then states **one** difference, "writing to $F003 only acknowledges a pending IRQ,
# but it does not move the 'A' control bit to the 'E' control bit". So the feature is one `bool` on
# `Vrc2Vrc4`, one three-line method on it and one `const fn` on `VrcIrq`, all three behind the
# feature, plus the number in `SUPPORTED_MAPPERS`, in `create_board` and in
# `Cartridge::clocks_on_cpu_cycle`.
#
# **A load-time field and not a `const` monomorphisation**, which is the one place this feature
# departs from §7.2's wording ("in the manner of `McAcc`"): a second monomorphisation of this board
# needs a second `Board` discriminant, and MF-6c steps 2 to 5 priced one of those at `mmc5`
# +0.066 % against a tolerance of +0.02 %. The field costs the five Konami numbers one test on a
# write to $F003 and nothing anywhere else, and **no savestate byte** -- the flag comes from the
# mapper number, so the block of mappers 21/22/23/25/27 is unchanged.
board-298 = []

# The VRC2's **Microwire one-bit latch at $6000-$6FFF** (MF-LEG-1 step 2, report entry VRC2-1;
# Q-174). nesdev ("VRC2 and VRC4"): the chip "was supposed to have shipped with a Microwire
# interface for save games. However, Konami never used it", and the games "rely on the two Data
# pins being connected to each other, and so expect to be able to read the written value back" --
# `.... ...L`, "1-bit latch value (r/w)", with "open bus for the top 7 bits". *Contra (J)* and
# *Ganbare Goemon 2 (J)* are the two titles the page names.
#
# **Installed only when the header declares no PRG-RAM and the VRC2 variant is the header's**, which
# is both Nestopia's gate (`if (!board.GetWram())`) and puNES's (NES 2.0 and no WRAM): so an iNES
# 1.0 dump keeps the 8 KiB of REQ-CORE-012 PRG-RAM it has today, which is what makes the two games
# work here by accident, and a correct NES 2.0 dump of a cartridge that has no RAM chip gets the
# latch the hardware has instead of open bus.
#
# **A feature of its own**, on `board-298`'s reason in the same words: with it off this board's
# struct and every function of it is byte for byte what the lot's base commit shipped, because the
# five Konami numbers may not pay for a register only three of them can have. What it costs with the
# feature on is one `is_some` on a write **below $8000** -- a write that reaches `write_register`
# there today only to be dropped -- and one `is_some` in `Mapper::try_read_prg`, whose arm this
# board already had a body for. **No savestate byte**: see `Vrc2Vrc4::microwire_latch` and Q-174
# section 2.
board-vrc2-latch = []

# **NES 2.0 mapper 1 submapper 3, the MMC1A** (MF-LEG-1 step 5, report entry MMC1-4). nesdev
# ("MMC1") prints the one place the two ASIC revisions differ, the `R` bit of $E000: on an MMC1A
# "1: fixed bank only affects A16..A14, bit 3 directly controls A17 across the entire $8000-$FFFF
# address range", where on an MMC1B the same bit is the PRG-RAM disable. And "PRG-RAM is always
# enabled at $6000-$7FFF" on that revision. Two games are known to rely on it, "writing values
# between $10 and $1F to the PRG bank register, write to WRAM at $6000-$7FFF, and expect the write
# to succeed".
#
# Three of the four cross-checked emulators implement the distinction and **this build already had
# the machinery**: `Mmc1::prg_disable_mask` exists exactly so that mapper 155 can zero it. What is
# new is that the submapper is a header field rather than a game-database lookup, and the A17 half,
# which is one more load-time mask.
#
# **A feature of its own**, and it is the one of this lot with a layout risk: the mask is a byte on
# `Mmc1`, the board of `m1`, `mm2`, `metroid` and `z2`, and MF-6b step 1 priced **one byte of
# displacement** on a comparable struct at +0.009 % to +0.027 % on eleven of PR-1's thirteen ROMs
# with no code added at all. With the feature off the field does not exist, the struct's layout is
# the base commit's to the byte, and `update_banks`'s two fixed-bank numbers fold back to the
# constants `outer` and `outer | $0F`.
#
# **Mapper 155 is deliberately not given the A17**, although the page makes it the same revision:
# it is outside this lot's scope. `docs/progress/MF-LEG-1.md` step 5 records it as the follow-up.
board-mmc1a = []

# **Not a board: the MMC1's SNROM `E` bit** (MF-LEG-1B, report entry MMC1-1; **Q-176**). Bit 4 of
# the CHR bank registers as a second chip enable for the PRG-RAM, which nesdev ("MMC1") gives the
# SNROM alone: "uses the upper CHR bank select line coming out of the mapper (CHR A16; bit 4 of
# bank number) as an additional chip enable for the PRG-RAM", the `E` bit being "PRG-RAM disable
# (0: enable, 1: open bus)".
#
# **Off in `default`, and not for a figure — it is the owner's decision**, taken 2026-11-08 in
# answer to Q-176. By default this build follows puNES and the four other cross-checked emulators:
# the `E` bit is not applied at all, the PRG-RAM being disabled by `$E000` bit 4 only and never on
# an MMC1A. None of FCEUX, Nestopia UE, puNES, Nintendulator or Mesen 2 implements it, and puNES
# wrote it out and then commented it out over a named regression — *Witch n' Wiz* shows corrupted
# screens after the save-slot selection. The board test cannot save it either: the SNROM's sizes
# are the SGROM's, so no iNES 1.0 dump can be told apart, and MF-LEG-1's header rule
# (`mmc1-snrom-header`, now removed) reads the suite's own SNROM images wrong.
#
# With the feature **on** the behaviour is exactly what every build from MF-3 to MF-LEG-1 shipped,
# the three-way size test of `Mmc1::is_snrom` included — PRG-ROM at most 256 KiB, declared CHR-ROM
# at most 8 KiB, effective PRG-RAM exactly 8 KiB. `holy-mapperel`'s `M1_P128K.nes` and
# `M1_P128K_CR8K.nes` probe detailed digit `4000` and are the two rows that turn on it: **required
# to fail in `default`** and asserted to pass here, `Mmc1::SNROM_E_BIT` being how a test asks which
# way a build went.
#
# Not in `parked-boards`, which is the umbrella for left-out *boards*, for the reason
# `ppu-exact-sprite-eval` and `ppu-2007-render-read` are not in it either.
# `cargo build -p zax-nes --features mmc1-snrom-e-bit` is the one flag that turns it on; the long
# version of the argument is at the `E`-bit site in `mmc1.rs`, and
# `docs/review/BOARD-FEATURES.md` has the row.
mmc1-snrom-e-bit = []

# Mapper 29, the Sealie Computing **RET-CUFROM revD** (MF-UNL-7 step 6): "allocated on 15-nov-2013
# to implement some homebrew games, including *Glider*".
#
# One register over the whole of $8000-$FFFF under mask $8000, `[...P PPCC]` -- two bits of 8 KiB
# CHR-**RAM** bank over "4x banks worth of full 8KB CHR ram" and three bits of 16 KiB PRG bank over
# eight, with $C000-$FFFF fixed to the last bank, hard-wired vertical mirroring and "8KB of WRAM
# mounted in the usual place".
#
# An **eighth** `LatchBoard` variant, so no new `DecodeBoard` variant and no new `Board` variant:
# MF-UNL-3 step 2 built that enum for exactly this shape, and this is the first member of it with
# CHR-RAM. Implies `board-decode-boards`.
#
# **The CopyNES flash-write path is not emulated**: "If EXP0 and R/W go low, /WR reaches the flash
# ROM. When EXP0 is high, the internal bankswitching register gets accessed." EXP0 is a cartridge
# edge pin a programmer drives, not a game, so the board always takes the second branch; the choice
# is recorded in `SingleLatch`'s own note, as the census asks.
board-29 = ["board-decode-boards"]

# Mapper 218, the single-chip homebrew board of *Magic Floor* and *Starfight* (MF-UNL-7 step 5) --
# the only board in this build with **no register, no latch, no bank line and no CHR memory**.
#
# "There is no CHR-ROM or CHR-RAM on the cartridge. Instead, the console's internal 2KiB nametable
# RAM is mapped as CHR-RAM", and the board "can be used in four configurations by wiring CIRAM A10
# to one of the PPU A10..A13 address lines" -- which the header's byte 6 declares, its four-screen
# bit picking the pair and its mirroring bit picking within it. Every access, pattern table or
# nametable, lands at `((PPU A<line>) << 10) | (PPU A9..A0)`: one expression, because that is the
# wiring.
#
# The 2 KiB is held as the cartridge's CHR-RAM and the nametables are answered through
# `Mapper::read_nametable`, the GTROM's shape (MF-6c step 9): one memory has to answer both
# ranges, and `Mapper::ppu_peek` cannot reach the PPU's own VRAM. Which side of the connector
# CIRAM sits on is invisible to a game; that the pattern tables and the nametables are the same
# 2 KiB is not, and it is what the board exists for. One `DecodeBoard` variant, the **fifth**
# distinct body of the `read_nametable` dispatch of Q-123 and the second inside that enum, so
# `Board`'s own jump table does not grow. Implies `board-decode-boards`.
board-218 = ["board-decode-boards"]

# Mappers 137, 138, 139 and 141, the Sachen **8259** -- one chip with four wirings (MF-UNL-7
# step 1). An index port at $4100 and a data port at $4101 under mask $C101, three bits wide, the
# same pair as `board-sachen-8reg`; eight internal registers of which the family page documents
# R0-R3 (the CHR block select), R4 (the outer bank), R5 (a 32 KiB PRG bank) and R7 (`.... .mms`,
# the mirroring mode and "simple" mode), and mapper 137's own page adds R6.
#
# The four wirings are the page's *CHR Rewiring* table as arithmetic: the 8259B (138) drives its
# six register bits onto CHR A16-A11 with PPU A10-A0 passed through, the A (141) onto A17-A12 with
# A11-A0 passed through and the C (139) onto A18-A13 with A12-A0 -- so the 2 KiB window the PPU's
# A12-A11 chose takes the bank shifted 0, 1 or 2 places, and the chip reaches 128, 256 or 512 KiB.
# The D (137) is the one with a page of its own: four **1 KiB** pages over $0000-$0FFF with
# $1000-$1FFF "fixed to last 4KiB", and an R4 that is one bit **per block** rather than three
# common upper bits, so only its fourth window reaches the whole 32 KiB.
#
# Two original titles: *The Great Wall* (the 8259D, "the only one known") and *Q-Boy* (the
# **2M-RAM-COB** board, which "replaces CHR-ROM with 8 KiB of unbanked CHR-RAM" and is "usually set
# to mapper 141"). The page's own disclaimer -- "gathered primarily from FCEU-mm ... it is likely
# incomplete" -- governs all four numbers, and **Q-160** records the two places the family page and
# mapper 137's contradict each other (mirroring modes 0 and 1, and what simple mode fixes them to).
#
# One `DecodeBoard` variant for all four, on the `Jv001` precedent, and one forward that enum
# already had for `board-sachen-8reg`: `nametable_page`, because R7 mode 2 is `(0,1,1,1)` -- a
# per-table layout no `NametableMirroring` can say. Implies `board-decode-boards`.
board-sachen8259 = ["board-decode-boards"]

# NES 2.0 mapper 268, the 聚芯 **AA6023** ASIC (SMD132 / SMD133) of the **COOLBOY** and **MINDKIDS**
# boards -- an MMC3 clone with **six outer bank registers** above the chip's own, which take it from
# the MMC3's 512 KiB to **32 MiB** of PRG-ROM (64 MiB on the YH2018A PCB), plus a GNROM-style
# banking mode, two "weird" modes, a mixed CHR-ROM/CHR-RAM window and a register lockout that is
# what lets a game keep WRAM behind the register window (lot MF-UNL-6).
#
# Twelve original titles, which is why census §7.2 gives the number a lot of its own: nine Chinese
# RPGs -- *大话水浒*, *楚留香新传*, *魔道劫*, *口袋妖怪: 叶绿* (vols 1-3), three *最终幻想* titles
# and *神奇宝贝* -- and the three modern licensed reissues *Gravity Trooper Metal Storm*,
# *Holy Diver* and *Quest Forge*.
#
# **Submappers 0 and 1 only**, which is six of the thirteen PCB codes the page lists and the six
# that carry every one of the twelve titles: the page indexes the codes by submapper and the groups
# do not share a register layout, so §7.2's "leave the rest refusing" is read as refusing
# submappers 2 to 11 at load with REQ-CORE-011's message (Q-157). Mapper 224 is the same chipset
# and has no title, so it is not added.
#
# One boxed `IrqBoard` variant holding an `Mmc3`, on the `board-mmc3-scramble` precedent: the board
# *is* the MMC3's board, counter included, so it answers yes to `Mapper::irq_asserted`, which is
# that enum's entry condition.
board-268 = []

# **Not a board: one mechanism of `board-jy-asic`**, on the `board-68-chr-nametables` precedent and
# the owner's rule of 2026-11-06 ("A costly *mechanism* of a board ... is implemented too, behind
# its own feature if it costs more than the board itself").
#
# The J.Y. ASIC's MMC4-like CHR latch is in `default` -- `$D003` bit 7 and the two latches move on
# the PPU's address bus like any other board's register. What this feature adds is the **tile
# emitter's view** of it: `Mapper::chr_latch_state`, `set_chr_latch_state` and `advance_chr_latch`
# forwarded through `IrqBoard`, so that a 3D tile record of a mapper-90 game carries the pattern
# the hardware would show at that column rather than the bank the latch holds at capture time
# (REQ-CORE-039). It is the MMC2's and the MMC4's contract, offered to a third board.
#
# Three bodies in those three dispatches re-lay `Ppu2C02::run_dots` out, and that function is 57 %
# to 62 % of `NesCore::run_frame`. MF-UNL-4 step 7 measured four shapes against `16a30564`:
# the forwards as first written cost `mmc5` **+0.374 %** and `smb3` +0.229 %; `#[inline(never)]`
# on all three -- what this feature ships -- costs `metroid` **+0.030 %** with five of thirteen
# ROMs over the tolerance; a `chr_latch` latch on `Cartridge` costs `mmc5` +0.326 % while making
# ten ROMs *faster*; and not forwarding them at all is below the base commit on all thirteen.
#
# **With it off the emulation is identical**, which is why it can be a feature at all: `Mapper`'s
# defaults are 0, nothing and nothing, so the tile emitter saves 0, moves nothing and restores 0.
# Out of `default`, and **not** in `parked-boards` -- that umbrella is for left-out *boards*, and
# the two PPU features set the precedent for a mechanism asked for by name:
#
#     cargo build -p zax-nes --features board-jy-asic-tile-latch
board-jy-asic-tile-latch = ["board-jy-asic"]

# Mappers 12 and 14, the **Huang-1** ASIC's other two PCBs (MF-UNL-8 steps 1 and 2) -- the same
# chip `board-116` already carries as the SOMARI-P, on two boards that are neither mapper 116's nor
# each other's. Two originals: Rex Soft's *Dragon Ball Z 5* (12) and the 8-character *Samurai
# Spirits* (14).
#
# * **12**, the Gouder **SL-5020B**: "The Huang-1 ASIC functions exclusively as an MMC3A clone on
#   this PCB" -- one mode, no supervisor register, no VRC2 and no MMC1 -- plus a GAL16V8 that adds
#   an outer CHR register at **$4132** under mask $E100 (`...B ...A`, one CHR A18 per pattern
#   table) and answers a read of the same address with a language bit. The counter is the MMC3A's,
#   which the page says is "necessary for running *Dragon Ball Z 5*". **Submapper 1 is refused at
#   load**: it is the Front Fareast Magic Card 4M, copier images with a trainer (census §1.8).
# * **14**, the Gouder **SL-1632** (`UNL-SL1632`): the chip with a PAL that "moves the supervisor
#   register address to **$A131**, overlapping the MMC3 and VRC2 registers there" -- **two** modes
#   (bit 1; MMC3 and VRC2b, no MMC1) and **three** independent CHR A18 bits (bits 3, 5 and 7) over
#   the unequal window groups $0000-$0FFF, $1000-$17FF and $1800-$1FFF. Its two Nestopia-sourced
#   rules are implemented with the page's own caveat attached.
#
# **§7.2 says mapper 12 "is `Somari` with one more register" and the number's own page refutes it**
# (Q-164), so what this feature reuses is the sub-chips and not mapper 116's board: an `Mmc3`
# through the accessors `Somari` already needed, and a `Vrc2Vrc4` through the VRC2b constructor it
# already had. With the feature off, every file of `board-116` and of the five Konami numbers is
# byte for byte what the base commit shipped; with it on, their structs, their save-state blocks
# and their hot paths are unchanged.
#
# One boxed `IrqBoard` variant for both numbers -- the board holds the chip's own counter, which is
# that enum's entry condition -- and one new `BankWindows` method, `or_chr_banks_each`, which is the
# per-window CHR A18 table MF-6b step 6 named before it existed. No new `Board` discriminant.
board-huang1 = []

# iNES mapper 83 and NES 2.0 mapper 264, the **Cony / Yoko** chip-on-board ASIC (MF-UNL-8 step 3).
# Four originals the census counts -- *Street Fighter II Pro* and variants, *Fatal Fury 2*,
# *World Heroes 2'* and *Super Blaster VII Turbo 28* -- plus *Mortal Kombat II/V Pro* and
# *Master Fighter VI* on the 264 PCB.
#
# "The distinction between mappers 83 and 264 as well as NES 2.0 Submappers denote different
# printed circuit boards that all incorporate the **same chip-on-board ASIC**", so this is **one
# board with four parameters** on the `Jv001` precedent and not five boards: the address remap of
# mapper 264 ("connects CPU A11.A10 to the ASIC's A9..A8 inputs", one expression), the 2 KiB CHR
# rewiring of 83.1 and 264 (CHR-ROM A11..A18 on the ASIC's A10..A17, so only registers 0, 1, 6 and
# 7 are used), the inner PRG bank's width (256 KiB on 83.0/83.1, 128 KiB on 83.3/264) and the PRG
# base register's bit layout.
#
# The register map is the page's whole *Registers* section: a PRG base at $8000, a mode register at
# $8100 (mirroring, four PRG banking modes, the $6000 window, the IRQ direction and the IRQ arm), a
# 16-bit counter at $8200-$8201 whose **clock is selectable between CPU M2 and PPU A12** ($8318),
# four 8 KiB PRG registers at $8300-$8303, eight 1 KiB CHR registers at $8310-$8317, the solder-pad
# read at $5000 and four bytes of scratch RAM at $5100-$5103.
#
# **Submapper 2 is refused at load**: the N-C88-1603 4-in-1 is the one PCB whose $6000-$7FFF is
# 32 KiB of PRG-NVRAM rather than PRG-ROM, with its bank in the PRG base register, which needs
# `Mapper::prg_ram_window` forwarded through `IrqBoard` -- a body in a `Board` dispatch this lot has
# no measurement for, for a multicart that carries no original title. MF-UNL-6's Q-157 is the
# precedent and **Q-167** records it. **Q-166** records the four things the page leaves open,
# including a printed register mask that cannot be right.
#
# One boxed `IrqBoard` variant, and every hook it needs is one that enum already forwards for the
# J.Y. ASIC -- the other board in there with two clock sources.
board-cony = []

# Mapper 91, the **JY830623C** / **YY840238C** (submapper 0) and the **EJ-006-1** (submapper 1)
# (MF-UNL-8 step 4). Four originals on the J.Y. board -- *Street Fighter 3*, *Mortal Kombat II*,
# *Dragon Ball Z 2* and *Mario & Sonic 2* -- plus the two *1995 Super HIK 4-in-1* multicarts.
# **Submapper 1's *Super Fighter III* is not counted**: "the commonly available ROM image of
# *Super Fighter III* is a mapper hack for INES Mapper 197", which is the page's own note about the
# dumps in circulation, so that title is not evidence for this board (census §7.2).
#
# "Submapper 0 has a PA12-based IRQ counter and hard-wired mirroring; submapper 1 an M2-based IRQ
# counter and selectable mirroring", and the two boards differ by **one mask bit** -- $F003 against
# $F007 -- plus the four registers that bit makes reachable. So this is **one board with one
# `bool`**: four 2 KiB CHR banks at $6000-$6003, two 8 KiB PRG banks at $7000-$7001, $C000-$FFFF
# fixed to the last bank, IRQ stop and start ports with the value ignored, and on submapper 1 two
# mirroring ports and a sixteen-bit counter register.
#
# Submapper 0 adds an **outer bank register whose diagram is an address and not a datum** -- `.PPC`
# of a write anywhere in $8000-$9FFF, "Mask: unknown" -- giving CHR A19 and PRG A17-A18 above a
# 128 KiB inner PRG bank. The two counters share nothing but their ports: 64 unfiltered A12 rises
# on one, "counting down by five every fourth M2 cycle" on the other. **Q-168** records the four
# things the page leaves open, the outer register's own bit order among them.
#
# One **unboxed** `IrqBoard` variant -- the board is a `BankWindows` and sixteen bytes, where that
# enum already carries an `Mmc3Board` inline -- and no new `Board` discriminant. Both hooks it needs
# are already forwarded there for the J.Y. ASIC and the Cony board.
board-91 = []

# Mapper 164, the 东达 (Dōngdá) PEC-9588 *Pyramid Educational Computer* and the 燕城 (Yànchéng)
# cy2000-3 board (MF-UNL-10). Six originals the census counts: *Final Fantasy 太空戰士 V* (G-003),
# *大話西游* (G-004), *櫻桃小丸子* (G-005), *岳飛傳* (G-006), *Dark Seed - 黑暗之蛊* (G-009) and
# *口袋精靈: 金* (Pokémon: Gold Edition).
#
# **An L in the census for two mechanisms, and both are the board's own.** First a **93C66
# 512-byte serial EEPROM over Microwire** — a third EEPROM shape beside `board-eeprom`'s two I²C
# parts and necessarily a second type, there being no framing in common between a two-wire bus with
# START conditions and a three-wire one with a chip select and a start bit (Q-170). It shares what
# matters instead: the **persistence path**, its 512 bytes living in `prg_ram` behind
# `registry::battery_offset` as `Eeprom24C0X`'s do, so neither EEPROM board's save format moves.
# Second the **1 bpp video mode**, which takes CHR A3 from PPU A0 and CHR A12 from PPU A9, "both
# latched on last rise of PPU A13" — mapper 163's mechanism with a second line on the same edge,
# and the reason 164 is in both of `Cartridge`'s PPU-address-bus lists.
#
# One `DecodeBoard` variant and **no `Board` discriminant**; `Mapper::prg_ram_window` forwarded
# there for the second time, `try_read_prg` for the fifth and `on_ppu_address_bus` for the fourth.
# `Pec9588::ppu_peek` is the one new *body* in a per-fetch dispatch, out of line for the reason
# every board of that shape has carried `#[inline(never)]` since MF-6a step 1.
#
# See `docs/review/BOARD-FEATURES.md` for the measured cost and `docs/progress/MF-UNL-10.md`.
board-164 = ["board-decode-boards"]

# Mappers 157 and 159, the Bandai LZ93D50 boards with a serial EEPROM: the Datach Joint ROM
# System (an internal X24C02 and, on *Battle Rush*, an external X24C01) and the four X24C01 games
# (MF-6c step 3). REQ-CORE-100's mapper-16 row makes the EEPROM "P3"; MR-1's table records "no
# counterpart" against Mesen's three files, and `Eeprom24C0X` is it. One `Option` field on
# `BandaiFcg`, no `Board` variant and no dispatch arm but `try_read_prg`'s.
board-eeprom = []

# Mappers 80, 207, 82 and NES 2.0 552 — the Taito X1-005 and X1-017, the two boards whose WRAM
# is inside the ASIC (MF-6c step 2). Thirteen titles. Two more `SmallBoard` variants and no
# `Board` variant, plus three forwards that family did not have: `try_read_prg` and
# `prg_ram_enabled`, because these boards decode $6000-$7FFF themselves, and `nametable_page` for
# mapper 207's CIRAM A10. Implies `board-small-boards`, the enum they live in.
#
# **Parked by MF-6c step 2 and un-parked by MF-CART step 5.** What parked it was one hoisted
# instruction in `Cartridge::default_cpu_read` — `&self.board`, materialised above the inlined
# `Board::try_read_prg` jump table for that table's cold arms, so that it ran on every CPU read
# of the one board which maps PRG-RAM into $8000-$DFFF: +7 456 756 over 300 frames of
# `mmc5exram` per unit (**+0.066 %**), and by MF-CART step 1 these two variants were buying
# **three** units. MF-6c measured seven shapes of the boards' own code against it and the figure
# never moved by an instruction, because it was never theirs. MF-CART step 4 took that function
# out of existence, and re-measured on the fixed tree this feature is **`mmc5` −0.112 %** with a
# worst ROM of **+0.001 %**. See `docs/review/BOARD-FEATURES.md`, `docs/progress/MF-6c.md` steps
# 2 and 3, and `docs/progress/MF-CART.md` steps 1, 4 and 5.
board-taito-x1 = ["board-small-boards"]

# The umbrella: every board left out of `default` because it is above the tolerance. MF-6b and
# MF-6a3 both ended with it empty, and the feature existed so that a later lot which did park a
# board would have the switch already wired; MF-6c step 2 was that lot and put `board-taito-x1`
# in it, step 9 added `board-111`.
#
# **MF-CART step 5 emptied it again, and the switch stays wired for the same reason it was wired
# before.** Both entries were above the tolerance on one instruction of
# `Cartridge::default_cpu_read` and nothing of their own, that lot's step 4 removed the
# instruction, and re-measured on the fixed tree the two features are `mmc5` −0.112 % and
# −0.111 % with worst ROMs of +0.001 % and +0.002 %. A later lot that does park a board adds it
# here and nowhere else; `--features parked-boards` is then still the one flag that reaches
# every left-out board at once, and with the list empty it is a no-op that still builds, which
# the suites check (`--features parked-boards` is one of the three configurations every step
# runs).
#
# **MF-VS step 7 put `board-vs-system` in it**, so the umbrella is no longer empty: that feature's
# own note above has the figures, and `--features parked-boards` is the one flag that turns the
# VS. System on. **MF-UNL-12 step 6 put `board-292` beside it**, the one board of the twelve MF-UNL
# lots that is over the tolerance; its own note has the figures and the two causes. **MF-LEG-2
# step 4 put `board-mmc5-exattr-split` beside those**, the MMC5's extended attribute mode and
# vertical split: over the tolerance on four of PR-1's thirteen and two of level 2's five, its
# own note above carrying the figures and the one symbol they come from.
parked-boards = [
    "board-vs-system",
    "board-292",
    "board-143-open-bus",
]

# The MMC5's **extended attribute mode** ($5104 = %01) and its **vertical split**
# ($5200-$5202), lot MF-LEG-2 — the two features of report entry MMC5-1, whose verdict is
# DIFFERS: all five cross-checked emulators implement them and this build did not, which the
# entry calls "by a wide margin the largest *visible* difference in the whole v0.4.2 set".
#
# With it on, a background tile in mode 1 takes its palette and a 4 KiB CHR bank from the ExRAM
# byte at its own nametable offset, and the split region takes its tile and attribute from ExRAM,
# its patterns from $5202's bank and its vertical scroll from $5201. Titles: *Just Breed*, the
# Koei strategy games (*Nobunaga's Ambition II*, *Romance of the Three Kingdoms II*, *Uncharted
# Waters*, *Bandit Kings of Ancient China*) and *Yakuman Tengoku* for the attributes, *Uchuu
# Keibitai SDF* and *Bandit Kings of Ancient China* for the split. **Castlevania III uses
# neither**, so the most-played MMC5 game is not in the list.
#
# **Armed at run time since lot MF-LEG-3** (the owner's decision of 2026-11-09), which is what
# makes the two modes affordable. A game cannot reach either without writing $5104 with mode %01
# or $5200 with bit 7 set, so the cartridge runs `Board::Mmc5` — `04731c86`'s board, to the
# instruction — until such a write arrives, and `Board::intercept_cpu_write`'s MMC5 arm then
# replaces the value with `Board::Mmc5Ext`, which is that same board plus the ten fields the two
# modes need, every register and memory carried across. It never goes back except through a reset
# or a state that says neither mode is armed. *Castlevania III*, the most-played MMC5 game, arms
# neither and therefore never leaves the first variant.
#
# **Off by default by the owner's decision, taken before any measurement; PARKED by MF-LEG-2's
# figures; and MF-LEG-3's figures withdraw them.** Measured against `04731c86` with this feature
# in `default` (MF-LEG-3 step 4), PR-1's thirteen ROMs: **worst `metroid` +0.010 %**, eleven of
# the twelve non-MMC5 ROMs at or below +0.008 %, the **set total -3 223 008 (-0.004 %)** *below*
# the base, and **`mmc5` itself -0.059 %** — faster than before the feature existed, because
# `mmc5exram` arms neither mode (measured over the campaign's own 300 frames). Level 2: **all
# five games inside +0.02 % on `core` and on `total`**, `core` +0.007 % to +0.010 %, `apu` and
# `draw_list` +0 to the instruction. For scale, a thirty-seventh `Board` variant that is **never
# constructed** costs `mmc5` +0.132 % and `metroid` +0.089 % on the same instrument, so these
# figures are tighter than a behaviour-free change's.
#
# MF-LEG-2's figures, for the record and because they are what the parking was for: `m1`
# +0.060 %, `m4` +0.061 %, `mm2` +0.085 %, `metroid` **+0.101 %**, `mmc5` **+2.522 %**, level-2
# `core` `mm2` +0.103 % and `metroid` +0.110 %. The whole of it was one symbol — about one
# instruction per CHR fetch in `Board::ppu_peek` and `Board::ppu_read`, because the MMC5's
# *existing* arm grew by the one `bool` a fetch tested — and seven shapes of the fetch path moved
# it by nothing. A **new** arm costs nothing where a grown one costs every board: with this
# feature on, those two dispatches are 64 496 640 and 22 674 330 on `m0`, the base commit's to
# the instruction.
#
# **It is still out of `default` and still in `parked-boards`**, because putting it in is R0's
# and the owner's call; `docs/review/BOARD-FEATURES.md` has the row and both sets of figures.
#
# **With the feature off the build is the base commit's binary, md5 for md5** — the whole file,
# not `.text` alone: nothing of the two modes is compiled, not a field, not a variant, not a
# macro arm.
#
# The implementation hangs on a test `Ppu2C02::read_nametable_as` already makes — the MMC5
# answers `SERVED_BY_CARTRIDGE` for all four tables while either mode is armed and serves every
# nametable-space byte through `Mapper::read_nametable_from_vram`, the one new hook. See the
# banner in `mmc5.rs` for the three points where the five emulators disagree and what this build
# chose, and for why $5201 and $5202 arm the switch as well.
#
# **A savestate crosses between the two configurations**, which is why the switch could ship:
# the MMC5's block is the same length in both variants and in a build without the feature, the
# split's three registers riding in the spare bits of the i32 that carries $5104's two (that
# register only ever holds 0 to 3). So packs' idle savestates and every state written before this
# lot still load. MF-LEG-2 appended three bytes after the sound block instead, and then no
# existing state loaded.
board-mmc5-exattr-split = []

# **Not a board: the PPU's exact sprite-evaluation pipeline** (lot MF-4e step 3). The owner's rule
# is written for boards but the reason behind it is the figure, so it is applied here unchanged.
#
# With this on, the sprite evaluation is the hardware's byte counter in two independently clocked
# halves against a second counter over the secondary OAM, and a `$2004` read during rendering
# answers from the OAM copy buffer instead of from `oam[oam_address]`. It wins three
# `AccuracyCoin` rows — `Address $2004 behavior`, `Arbitrary Sprite zero` and `Misaligned OAM
# behavior`, 129 → 132 / 147 — and it is **above the tolerance on both runs**: PR-1's thirteen are
# +0.041 % to +0.133 % on the eleven ROMs whose behaviour does not move (worst `metroid` +0.133 %),
# and all ten level-2 figures are above at +0.057 % to +0.127 %. So it is out of `default`, and
# **not dropped**: one flag gives the exact pipeline.
#
# It is deliberately **not** in `parked-boards`, which is the umbrella for left-out *boards*; a
# build that wants everything asks for both. `docs/review/BOARD-FEATURES.md` has the row and the
# command.
#
# The `$2007`-during-rendering rule of step 2 is **not** behind this: it has its own feature,
# `ppu-2007-render-read` below, which lot MF-4e-gate added. It was in every build when MF-4e
# shipped — the figure is +0.000 % to +0.005 % on the eleven — and R0 took it out of `default` on
# 2026-11-07 for what it changes on screen rather than for what it costs.
ppu-exact-sprite-eval = []

# **Not a board either: the `$2007`-during-rendering rule** (lot MF-4e step 2, gated by lot
# MF-4e-gate). With this on, a `$2007` access — the read *and* the register-7 write — made while
# the PPU is fetching moves `v` by a coarse X increment and a Y increment at once instead of by
# PPUCTRL's 1 or 32, and that borrowed increment reaches `v_row_next` but **not** `v_row_start`,
# which is what lets AMD-021 R2-005 criterion 2 hold with it (Q-125, Q-137). With it off,
# `Ppu2C02::increment_vram_address` is `11407930`'s body line for line.
#
# `AccuracyCoin` **128 → 129 / 147**, the row `PPU Misc. / $2007 read w/ rendering`; 132 with
# `ppu-exact-sprite-eval` beside it.
#
# **This one is not parked for a figure.** It measures +0.000 % to +0.005 % on the eleven ROMs of
# PR-1's set whose behaviour does not move, well inside the owner's +0.02 % tolerance. It is out of
# `default` because of **what it changes on screen**: R0's dense A/B of the 3D packs against v0.4.2
# (2026-11-07) found it moving the picture in the two games the owner watches most — *Super Mario
# Bros. 3*, 58 of 681 sampled frames over 5 dumps, and *Zelda II*, 18-19 of 1 001 over 2 — with and
# without a pack, and SMB3's split line under the widescreen hack is where the owner saw a bug the
# last time this rule shipped (lot MF-4d, backed out by MF-4d-fix). The owner validates it by eye
# before it is the default; until then the default build renders this path as v0.4.2 does.
#
# Not in `parked-boards`, for the reason `ppu-exact-sprite-eval` is not: that umbrella is for
# left-out *boards*. `docs/review/BOARD-FEATURES.md` has the row and the command.
#
# **In `default` since 2026-11-12 (Q-139 closed).** Lot ACCURACY-1 measured SMB3's status bar one
# line low without it against both MesenCE and NesHawk, and identical to NesHawk with it; the owner
# then validated SMB3 and Zelda II by eye, with and without the widescreen pack. Golden-core over
# the 98 originals moves on the 8 SMB3 and 3 Zelda II dumps only, picture and tiles only (cycles
# and audio unchanged): `268b4adbd7ce36155bb02f591c892f08c91a4b9ff063aba7fea2d48198341840`.
ppu-2007-render-read = []

# BizHawk's `.bk2` movies and the TAS reader the harness and the application share (owner request:
# the application opens a `.bk2`). Off by default so the core alone pulls no archive library.
bk2 = ["dep:sha1", "dep:zip", "dep:serde_json"]

# The types the two engines share (lot FCEUX-23 step 2). Everything of it is re-exported below at
# the path it used to be at, so a consumer of this crate need not know it moved.
[dependencies]
zax-core-api = { path = "../zax-core-api" }
# The `.bk2` reader (feature `bk2`): the archive and the ROM's SHA-1 the movie names.
sha1 = { version = "0.11.0", default-features = false, optional = true }
zip = { version = "7.3.0", default-features = false, features = ["deflate"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
sha2 = "0.10"
zax-core-api = { path = "../zax-core-api" }
zax-goldens = { path = "../zax-goldens" }
