[package]
name = "zax-nes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# One feature per board that raises any figure (owner's rule, 2026-11-06). Each gates its
# board's code, its `Board` variant or `const` monomorphisation, every dispatch arm, its
# `SUPPORTED_MAPPERS` entries, its `registry` arms, its `board_memory_sizes` arm, its
# save-state block and its tests. A board whose measured cost is inside the owner's tolerance
# (at most +0.02 % per ROM on both runs) is in `default`; one above it is left out, and
# `parked-boards` then enables all the left-out ones at once.
#
# `docs/review/BOARD-FEATURES.md` is the table: a row per feature, with the measured cost per
# ROM on both runs and the one command that flips it.
[features]
default = [
    "board-94",
    "board-105",
    "board-116",
    "board-119",
    "board-153",
    "board-155",
    "board-68",
    "board-68-chr-nametables",
    "board-77",
    "board-jaleco-72-92-86",
    "board-96",
    "board-eeprom",
    "board-158",
    "board-mmc3-multicart",
    "board-namcot108",
    "board-small-boards",
]

# Mappers 76, 88, 95, 154 and 206, the Namco 108 / DxROM family: one board with four
# parameters, 45 titles (MF-6a step 1, which measured `smb3/core` +45 707 and `m4` +66 921).
board-namcot108 = []

# Mappers 33, 70, 75, 89, 93, 97, 140, 152, 184, 185 and 232 — the Taito TC0190, the Bandai
# 74161/7432, Konami VRC1, both Sunsoft-2 boards, the Irem TAM-S1, the Jaleco JF-11/14,
# Sunsoft-1, CNROM with the security diodes and the Camerica BF9096 — nine boards **sharing one
# `Board` variant**, which is what `SmallBoard`'s own note exists for. One feature for the
# family, because one variant is what the measurements of MF-6a steps 2, 3 and 4 priced.
board-small-boards = []

# Mapper 94, the HVC-UN1ROM: a wiring of the UxROM board, its bank field shifted two bits
# (MF-6a step 4). One title, *Senjou no Ookami*.
board-94 = []

# Mapper 155, the MMC1 on a board with no PRG-RAM disable wire (MF-6a step 4). MF-6a2 step 2
# traced that step's `mm2/core` +10 506 to this parameter exactly and then removed it with the
# two-mask idiom, which left `Mmc1::update_banks` five instructions *below* the reference.
board-155 = []

# Mapper 105, the Nintendo NES-EVENT board of *Nintendo World Championships 1990* (MF-6b step 3).
board-105 = []

# Mapper 158, Tengen's 800037: the RAMBO-1 with CHR A17 wired to CIRAM A10 (MF-6b step 5). One
# title, *Alien Syndrome*.
board-158 = []

# Mapper 116, the Gouder SOMARI-P and its Huang ASIC: three mapper implementations (a VRC2, an
# MMC3 and an MMC1) in one board with a supervisor register at $4100 (MF-6a3 step 4). Six
# unlicensed titles, *Somari the Adventurer* among them; REQ-CORE-101 makes the number optional
# and Q-130 question 1 is the decision to implement it.
board-116 = []

# Mapper 119, the Nintendo TQROM: *High Speed* and *Pin\*Bot*. A `const` parameter of the
# MMC3's board, with its CHR-RAM chip's select, its two `#[inline(never)]` fetch bodies and the
# 8 KiB in `board_memory_sizes` (MF-6a3 step 1).
board-119 = []

# Mappers 47 and 37, Nintendo's two MMC3 multicarts: *Super Spike V'Ball + Nintendo World Cup*
# and *Super Mario Bros. + Tetris + Nintendo World Cup*. One `const` monomorphisation of the
# same board with an outer register at $6000-$7FFF above its bank numbers (MF-6a3 step 1).
board-mmc3-multicart = []

# Mapper 153, the Bandai FCG board with an LZ93D50 and 8192 bytes of battery-backed WRAM
# (MF-6c step 1). One title, *Famicom Jump II: Saikyou no 7-nin*. Two bytes and three branches
# on `BandaiFcg`, which is mapper 16's board: no `Board` variant, no dispatch arm anywhere.
board-153 = []

# Mapper 68, the Sunsoft-4 (MF-6c step 4): four 2 KiB CHR banks, four mirroring modes, a PRG-RAM
# enable and a 16 KiB window. One more `SmallBoard` variant; "IRQ: None" on its page, which is
# that enum's entry condition. *After Burner*, *Maharaja*, *Nantettatte!! Baseball* and the rest.
board-68 = []

# **Mapper 68's CHR-ROM nametable mode alone**, $E000 bit 4, which is the *third* distinct body of
# the `Mapper::read_nametable` dispatch Q-123 measured a cap of two on (MF-6c step 4). Its own
# feature because the owner's rule of 2026-11-06 says a costly mechanism of a board is built
# "behind its own feature if it costs more than the board itself"; the bit is decoded and kept in
# the savestate either way, so this switches the *serving* and not the decode.
board-68-chr-nametables = ["board-68"]

# The **second** shared `Board` variant for boards that are a register decode and nothing else,
# `DecodeBoard`, with no board of its own: each board feature below implies it. It exists because
# MF-6c steps 2 to 5 measured `SmallBoard` and `IrqBoard` as both **full** -- one more variant in
# either costs `mmc5` +7 456 756 instructions over 300 frames, +0.066 %, against a tolerance of
# +0.02 % -- and R0's decision of 2026-11-06 is to measure one new `Board` discriminant for all
# four of this lot's remaining boards instead. See `DecodeBoard`'s own note.
#
# Not meant to be selected alone: with no board feature on, the enum has no variant.
board-decode-boards = []

# Mapper 77, the Irem LROG017 of *Napoleon Senki* (MF-6c step 6): one `[CCCC PPPP]` register, bus
# conflicts, four-screen mirroring, and a **split CHR** -- 2 KiB of swappable CHR-ROM at
# $0000-$07FF with the 6 KiB CHR-RAM chip at $0800-$1FFF, which no `ChrView` can describe. First
# member of `DecodeBoard`, and the board whose own bar was `Ppu2C02::read_pattern_planes` (§5
# MF-6c step 5 of `docs/review/MF-6-inventory.md`).
board-77 = ["board-decode-boards"]

# Mappers 72, 92 and 86 -- Jaleco's JF-17, JF-19 and JF-13, the three boards with a uPD7756C
# ADPCM speech chip (MF-6c step 7). Six titles. Two `DecodeBoard` variants and no `Board`
# variant: 72 and 92 are one board whose `is_jf19` bool picks which PRG window its latch drives,
# and 86 is a different board with the same chip. **The audio is not implemented and that is a
# decision, not an omission**: REQ-CORE-075's list of expansion-audio chips does not include it
# and its samples live in a mask ROM inside the ASIC, which is in no source this project may read
# (§4.8 of `docs/review/MF-6-inventory.md`). `expansion_audio_output` keeps its `None` default and
# a test pins the silence. Implies `board-decode-boards`.
board-jaleco-72-92-86 = ["board-decode-boards"]

# Mapper 96, the Bandai Oeka Kids board (MF-6c step 8): a 32 KiB PRG bank and a 16 KiB outer
# CHR bank from one CPU register, and a 4 KiB inner CHR-RAM bank **latched off the PPU address
# bus** on the entry into $2000-$2FFF -- including a bare $2006 write, which is 4.4's "not
# academic" distinction and MR-1's open MMC2 question answered for this board from its own
# page. Two titles, both drawing programs for the Oeka Kids tablet, which is a recorded gap:
# this build has no host surface for that peripheral. One `DecodeBoard` variant, in both
# PPU-bus latches, and one new forward, `on_ppu_address_bus`. Implies `board-decode-boards`.
board-96 = ["board-decode-boards"]

# Mapper 111, the Membler Industries GTROM / Cheapocabra board (MF-6c step 9) -- **parked**. One
# register
# at $5000-$5FFF and $7000-$7FFF with a 32 KiB PRG bank, an 8 KiB CHR-RAM bank, an 8 KiB
# nametable bank and two LEDs, and an SST39SF040 flash chip the game saves into. Seven
# homebrew titles. One `DecodeBoard` variant and three new forwards, because its two
# nametable banks are the **fourth** distinct body of the `Mapper::read_nametable` dispatch
# Q-123 once measured a cap of two on. The LEDs, the register's read side and the flash's
# persistence are recorded gaps; see `Cheapocabra`'s own note. Implies
# `board-decode-boards`.
#
# **The second board of this project to be parked, and the fifth `DecodeBoard` variant is what
# parks it.** `Cartridge::default_cpu_read` flips to the dearer of its two measured layouts on
# `mmc5exram`, +7 456 756 instructions over 300 frames -- **+0.066 %** against the owner's
# +0.02 % -- on a board this feature does not touch. It is the same quantised figure MF-6c steps
# 2, 4 and 5 measured for the eleventh `SmallBoard` variant and the eleventh and twelfth
# `IrqBoard` ones, so **each shared enum has its own limit** and `DecodeBoard`'s is four. Step 9
# also measured the board with its nametable banks switched off and got the same figure, which
# refutes the fourth `Mapper::read_nametable` body as the cause and is why there is one feature
# here and not two. See `docs/review/BOARD-FEATURES.md` and `docs/progress/MF-6c.md` step 9.
board-111 = ["board-decode-boards"]

# Mappers 157 and 159, the Bandai LZ93D50 boards with a serial EEPROM: the Datach Joint ROM
# System (an internal X24C02 and, on *Battle Rush*, an external X24C01) and the four X24C01 games
# (MF-6c step 3). REQ-CORE-100's mapper-16 row makes the EEPROM "P3"; MR-1's table records "no
# counterpart" against Mesen's three files, and `Eeprom24C0X` is it. One `Option` field on
# `BandaiFcg`, no `Board` variant and no dispatch arm but `try_read_prg`'s.
board-eeprom = []

# Mappers 80, 207, 82 and NES 2.0 552 — the Taito X1-005 and X1-017, the two boards whose WRAM
# is inside the ASIC (MF-6c step 2). Thirteen titles. Two more `SmallBoard` variants and no
# `Board` variant, plus three forwards that family did not have: `try_read_prg` and
# `prg_ram_enabled`, because these boards decode $6000-$7FFF themselves, and `nametable_page` for
# mapper 207's CIRAM A10. Implies `board-small-boards`, the enum they live in.
#
# **The first board of this project to be parked**, and it is one instruction that parks it:
# `Cartridge::default_cpu_read` flips to the dearer of its two measured layouts, in which LLVM
# hoists `leaq 240(%rdi), %rax` above the inlined `Board::prg_ram_enabled` dispatch so that it
# runs on every call. That is +7 456 756 over 300 frames of `mmc5exram` -- **+0.066 %**, against
# the owner's +0.02 % -- on a board this feature does not touch. MF-6c step 2 measured **seven**
# shapes against it, step 3 re-measured it on a changed tree, and the figure never moved by an
# instruction; it is the same one MF-6b steps 2-5 were charged and MF-6a3 step 4 was given back.
# See `docs/review/BOARD-FEATURES.md` and `docs/progress/MF-6c.md` steps 2 and 3.
board-taito-x1 = ["board-small-boards"]

# The umbrella: every board left out of `default` because it is above the tolerance. MF-6b and
# MF-6a3 both ended with it empty, and the feature existed so that a later lot which did park a
# board would have the switch already wired. **MF-6c step 2 is that lot**: `board-taito-x1` was
# the first entry it ever had, and **MF-6c step 9 adds `board-111`** on the same quantised
# +7 456 756, bought this time by the fifth `DecodeBoard` variant.
parked-boards = ["board-111", "board-taito-x1"]

[dev-dependencies]
sha2 = "0.10"
zax-goldens = { path = "../zax-goldens" }
