board-145 = ["board-decode-boards"]

# Mapper 149, the Sachen **SA-0036** of *Taiwan Mahjong 16*: the same one bit, "just like mapper
# 145, but moves the register to overlap with PRG ROM and so **has bus conflicts**" -- mask
# $8000, so every address in $8000-$FFFF is the register, and the AND with the ROM byte is
# `registry::has_bus_conflicts`'s generic path.
#
# Measured with the lot's other seven against `452e8464` (MF-UNL-3 step 7): PR-1's thirteen ROMs
# worst `m1`/`oamstr` +0.003 %, set total +595 604 (+0.001 %); level 2 all five `core` inside at
