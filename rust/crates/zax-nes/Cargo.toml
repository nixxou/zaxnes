[package]
name = "zax-nes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# One feature per board that raises any figure (owner's rule, 2026-11-06). Each gates its
# board's code, its `Board` variant or `const` monomorphisation, every dispatch arm, its
# `SUPPORTED_MAPPERS` entries, its `registry` arms, its `board_memory_sizes` arm, its
# save-state block and its tests. A board whose measured cost is inside the owner's tolerance
# (at most +0.02 % per ROM on both runs) is in `default`; one above it is left out, and
# `parked-boards` then enables all the left-out ones at once.
#
# `docs/review/BOARD-FEATURES.md` is the table: a row per feature, with the measured cost per
# ROM on both runs and the one command that flips it.
[features]
default = [
    "board-94",
    "board-105",
    "board-116",
    "board-119",
    "board-mmc3-chrram",
    "board-mmc3-scramble",
    "board-263",
    "board-189",
    "board-153",
    "board-155",
    "board-68",
    "board-68-chr-nametables",
    "board-77",
    "board-jaleco-72-92-86",
    "board-96",
    "board-eeprom",
    "board-158",
    "board-mmc3-multicart",
    "board-namcot108",
    "board-small-boards",
    "board-taito-x1",
    "board-111",
    "board-jv001",
    "board-sachen-8reg",
    "board-133",
    "board-nina03",
    "board-38",
    "board-107",
    "board-143",
    "board-144",
    "board-145",
    "board-149",
    "board-190",
    "board-jy-asic",
    "board-163",
]

