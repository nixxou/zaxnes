# Mapper 215, the Sugar Softec **UNL-8237** (submapper 0) and **UNL-8237A** (submapper 1)
# (MF-UNL-11 step 1): an MMC3 clone whose register addresses and bank indices are permuted by
# **one of eight patterns a register at $5007 selects at run time**, with outer PRG and CHR banks
# at $5001 and an NROM-like PRG override at $5000. Four originals -- *Earthworm Jim 2*,
# *Mortal Kombat 3*, *Mortal Kombat 3 Extra 60* and *Pocahontas Part 2* -- plus the eight
# multicarts the chipset was made for.
#
# One boxed `IrqBoard` variant holding an `Mmc3` and three register bytes, on
# `board-mmc3-scramble`'s precedent: the scramble is two eight-row `const` tables and not a
# second chip, and five of the eight address rows are the identity, so a multicart's menu runs as
# an ordinary MMC3 before any $5007 write. The one addition outside the board is
# `BankWindows::remap_chr_banks`, `remap_prg_banks`'s counterpart on the CHR table, which $5000
# bit 6's "replace PRG A17 **and CHR A17** from the MMC3" needs.
board-215 = []

# Mapper 208, the unnamed **Gouder** board of the 快打傳説 *Street Fighter IV* backport (MF-UNL-11
# step 2): an MMC3 clone whose PRG-ROM is banked in **32 KiB** amounts by a register at
# $4800-$4FFF and $6800-$6FFF -- which also drives the mirroring, the chip's $A000 being inert --
# with a **256-byte protection lookup table**: an index at $5000-$57FF, and four registers at
# $5800-$5FFF that latch the CPU datum **XORed with the indexed entry** and answer a read of the
# same window. One original title, and the page says so: "This mapper is used on exactly one known
# game."
#
# One boxed `IrqBoard` variant holding an `Mmc3`, five register bytes and a 256-byte `const`.
# Submapper 1 is the copyright-stripped hack, which has none of those registers: its one 32 KiB
# page is the chip's own R6 shifted right twice, and its mirroring and IRQ are the chip's. The
# `board_memory_sizes` row gives submapper 0 no PRG-RAM, because its $6800 register *is* the
# board's decode of that window.
board-208 = []

# Mapper 219, the Kasheng **A9461** (MF-UNL-11 step 3): an MMC3 clone with a second, **extended**
# banking mode that $8002 bit 5 opens -- four independent 8 KiB PRG banks, each with a separate
# register of its own and a bank field that is
# **bit-reversed**, a CHR bank-number latch supplying bits 4-6 of every following CHR switch, a
# "pseudo 2 KiB" 1 KiB switch over PPU $0000-$0FFF whose quarter number is also bit 0 of its bank,
# and a plain 1 KiB switch over $1000-$1FFF -- above a two-bit 128 KiB outer PRG **and** CHR bank
# at $5002/$5003. With the mode bit clear the board is an MMC3 masked to 128 KiB. One original
# title, *Toy Story*, with the *Super 1997 4-in-1* multicart beside it.
#
# One boxed `IrqBoard` variant holding an `Mmc3` and sixteen bytes of extended bank registers.
# **Q-171** records the two readings the page forces: the mode bit is latched by $8002 alone while
# the index is latched by every even address of the window -- the only way its five-bit `R RRRR`
# field and its six-bit extended index values can both be true -- and `Mask: $5003` is read as
# $F003, because taken literally it would decode $D002/$D003, the chip's own IRQ ports.
board-219 = []

# NES 2.0 mapper 262, the Sachen **UNL-SHERO** (MF-UNL-12 step 1): an MMC3 clone with "both
# CHR-ROM and 8 KiB of CHR-RAM, as well 4 KiB of additional VRAM for four-screen mirroring". One
# port, $4100: bit **6** picks which CHR chip the PPU reaches, bits 3-0 drive CHR A18 over the four
# 2 KiB regions -- in the page's own order, which gives bit 1 the region $1800-$1FFF and bit 0 the
# region $1000-$17FF, crossing the two bottom regions against the "8421" weights the diagram labels
# them with -- and a **read** of the same port answers the board's title jumper in bit 7. Two
# original titles, *Street Heroes* and *侍魂 (Shìhún)*.
#
# One boxed `IrqBoard` variant holding an `Mmc3` and one register byte. The CHR-RAM chip is banked
# by bits 0-2 of whatever 1 KiB bank number the chip put in the window -- the TQROM's arithmetic
# through `Mmc3Board::chr_bank_of_window`, whose `cfg` this feature widens -- and the 8 KiB is a
# `board_memory_sizes` row for the TQROM's reason: no header field can state a CHR-RAM chip beside
# a CHR-ROM. The 4 KiB of four-screen VRAM is the console's own (`ppu::VRAM_SIZE`), so the board
# only says `NametableMirroring::FourScreen` and takes `$A000` away from the chip.
#
# **Q-172** holds the four readings this page forces: the two masks it calls "probably" or
# "unknown" and leaves as written, the select being bit **6** and the A18 lines being crossed
# (both read off the diagram's column positions), the CHR-RAM chip's own three address lines,
# which the page does not state at all, and the jumper -- a board wiring no header field can
# declare, answered as 0 (*Street Heroes*) with the gap recorded.
board-262 = []

# NES 2.0 mapper 292, the **BMW8544** / UNL-DRAGONFIGHTER (MF-UNL-12 step 2): an MMC3 clone whose
# "PRG banking, mirroring and scanline IRQ work as on a normal MMC3" and whose **CHR banking does
# not**. Four extra registers in $6000-$7FFF: an index register a **write** sets, two data registers
# a **read** fills from the datum of the last CPU write to any address, and that latch itself. They
# carry the eight XOR bits of the 2 KiB bank at PPU $0000-$07FF, CHR A18 of the 2 KiB bank at
# $0800-$0FFF and the whole 4 KiB bank at $1000-$1FFF -- which is both the protection and the way
# the board reaches 512 KiB of CHR-ROM. One original title, *Dragon Fighter* (the unlicensed one,
# not Natsume's).
#
# One boxed `IrqBoard` variant holding an `Mmc3` and three register bytes, plus the **one new hook
# of lot MF-UNL-12**: `CartridgeMemory::cpu_write_latch`, a byte `NesBus::write_internal` stores on
# every CPU write. The page requires it -- "All CPU writes, including writes to zero page memory,
# are visible on the cartridge connector … The game writes the desired values to zero page" -- and
# §7.2's "no new hook" is the one claim of this lot's plan that a page overrides (**Q-172**). With
# the feature off there is no field and no store: the byte and the `if let` are both behind it.
#
# It is also the first board of `IrqBoard` to need `Mapper::cpu_read_override`, forwarded
# `#[inline(never)]` there for the reason `try_read_prg` carries it.
#
# **Parked by MF-UNL-12 step 6**, and it is the only board of the twelve MF-UNL lots that is. The
# figures, against `c02fc02c` and attributed to this feature alone (the lot's tree with it on
# against the same tree with it off): PR-1's thirteen ROMs **all slower**, `mmc5exram`
# **+123 750 428, +1.098 %** -- fifty-five times the tolerance -- with `oamstr` +0.026 %,
# `vblnmi` +0.020 %, `m1` +0.017 % and a set total of +130 067 231 (+0.164 %). Level 2 with it on
# is `core` **above the base on all five games**, +0.009 % to +0.017 %.
#
# **Two causes, and neither has a fix.**
#
# * `Board::cpu_read_override` gains a **body**. `IrqBoard` had no forward for it, so it shared
#   that dispatch's *empty* arm -- and the dispatch carries `#[inline(always)]` (pinned by lot
#   PR-1 step 3) and folds into `Cartridge::try_cpu_read`, which the MMC5 reaches on **every CPU
#   read** because it maps PRG-RAM into $8000-$DFFF. That is `Cartridge::try_cpu_read`
#   +122 851 006 on `mmc5exram`, and it is MF-5b's "the arm that matters is the empty one" one
#   dispatch further along. A board whose registers a **read** fills needs a `&mut self` read hook
#   and this build has exactly one.
# * the latch store in `NesBus::write_internal`: +157 036 to +862 997 on every ROM of the set,
#   worst `oamstr` **+0.026 %** -- a ROM whose whole run is OAM writes. **Splitting the board into
#   two features would not help**: `oamstr`'s figure is +862 997 of +874 540, so the latch alone is
#   already over the tolerance.
#
# Gated off it costs nothing: the shipped tree, with this feature in `parked-boards` and the other
# two in `default`, is PR-1 worst ROM **+0.003 %** (`m4`) and set total +795 012 (+0.001 %).
# `cargo build -p zax-nes --features parked-boards` is the one flag that turns it on.
board-292 = []

# iNES mapper 246, the **G0151-1** board of 封神榜 (MF-UNL-12 step 3): four 8 KiB PRG banks at
# $6000-$6003 and four 2 KiB CHR banks at $6004-$6007, both under the mask
# `A~[0110 0000 000. .?rr]` ($FFE4), 2 KiB of battery PRG-RAM at the unusual $6800-$6FFF, hard-wired
# mirroring from the header, and **PRG A17 forced high on a read of $FFE4-$FFE7, $FFEC-$FFEF,
# $FFF4-$FFF7 or $FFFC-$FFFF** -- which is the register mask again, `address & $FFE4 == $FFE4`. One
# original title, and the page says so: "used only for the Taiwanese game 封神榜".
#
# One `DecodeBoard` variant -- the board has no counter, which is that enum's entry condition -- and
# **two new forwards on it**, both for this number alone:
#
# * the PRG read cache's four-entry answer, because the forced A17 depends on the address *within*
#   the $E000-$FFFF window: that window must be `NO_ROM_WINDOW`, so `Cartridge::read_rom_window`
#   cannot serve it and every read of it reaches the board. The other three keep the fast path.
#   This is the one body of the lot that lands inside the single `Board` dispatch lot MF-CART
#   step 4 built for the CPU read path, where MF-UNL-10 step 2 measured +0.009 % on `m4` for one
#   such body.
# * `intercept_cpu_write`, because the eight registers and the RAM chip share the $6000-$7FFF window
#   `Cartridge::cpu_write` routes to PRG-RAM.
#
# **Q-172** records three things: the register window the page's mask actually gives ($6000-$601F,
# not §7.2's "$6000-$67FF", which is Mesen's decode), the three mirrors of a 2 KiB chip across
# $6000-$7FFF that `Mapper::prg_ram_window` cannot refuse, and "Register $6003 is set to $FF at
# power-on **only**" -- so a reset leaves that one register alone, which is what AMD-061's sweep
# would otherwise have contradicted.
board-246 = ["board-decode-boards"]

# Mappers 47 and 37, Nintendo's two MMC3 multicarts: *Super Spike V'Ball + Nintendo World Cup*
# and *Super Mario Bros. + Tetris + Nintendo World Cup*. One `const` monomorphisation of the
