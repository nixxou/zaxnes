board-mmc3-multicart = []

# Mapper 153, the Bandai FCG board with an LZ93D50 and 8192 bytes of battery-backed WRAM
# (MF-6c step 1). One title, *Famicom Jump II: Saikyou no 7-nin*. Two bytes and three branches
# on `BandaiFcg`, which is mapper 16's board: no `Board` variant, no dispatch arm anywhere.
board-153 = []

# Mapper 68, the Sunsoft-4 (MF-6c step 4): four 2 KiB CHR banks, four mirroring modes, a PRG-RAM
# enable and a 16 KiB window. One more `SmallBoard` variant; "IRQ: None" on its page, which is
# that enum's entry condition. *After Burner*, *Maharaja*, *Nantettatte!! Baseball* and the rest.
board-68 = []

# **Mapper 68's CHR-ROM nametable mode alone**, $E000 bit 4, which is the *third* distinct body of
# the `Mapper::read_nametable` dispatch Q-123 measured a cap of two on (MF-6c step 4). Its own
# feature because the owner's rule of 2026-11-06 says a costly mechanism of a board is built
# "behind its own feature if it costs more than the board itself"; the bit is decoded and kept in
# the savestate either way, so this switches the *serving* and not the decode.
board-68-chr-nametables = ["board-68"]

# The **second** shared `Board` variant for boards that are a register decode and nothing else,
# `DecodeBoard`, with no board of its own: each board feature below implies it. It exists because
# MF-6c steps 2 to 5 measured `SmallBoard` and `IrqBoard` as both **full** -- one more variant in
# either costs `mmc5` +7 456 756 instructions over 300 frames, +0.066 %, against a tolerance of
# +0.02 % -- and R0's decision of 2026-11-06 is to measure one new `Board` discriminant for all
# four of this lot's remaining boards instead. See `DecodeBoard`'s own note.
#
# Not meant to be selected alone: with no board feature on, the enum has no variant.
board-decode-boards = []

# Mapper 77, the Irem LROG017 of *Napoleon Senki* (MF-6c step 6): one `[CCCC PPPP]` register, bus
# conflicts, four-screen mirroring, and a **split CHR** -- 2 KiB of swappable CHR-ROM at
# $0000-$07FF with the 6 KiB CHR-RAM chip at $0800-$1FFF, which no `ChrView` can describe. First
# member of `DecodeBoard`, and the board whose own bar was `Ppu2C02::read_pattern_planes` (§5
# MF-6c step 5 of `docs/review/MF-6-inventory.md`).
board-77 = ["board-decode-boards"]

# Mappers 72, 92 and 86 -- Jaleco's JF-17, JF-19 and JF-13, the three boards with a uPD7756C
# ADPCM speech chip (MF-6c step 7). Six titles. Two `DecodeBoard` variants and no `Board`
# variant: 72 and 92 are one board whose `is_jf19` bool picks which PRG window its latch drives,
# and 86 is a different board with the same chip. **The audio is not implemented and that is a
# decision, not an omission**: REQ-CORE-075's list of expansion-audio chips does not include it
# and its samples live in a mask ROM inside the ASIC, which is in no source this project may read
# (§4.8 of `docs/review/MF-6-inventory.md`). `expansion_audio_output` keeps its `None` default and
# a test pins the silence. Implies `board-decode-boards`.
board-jaleco-72-92-86 = ["board-decode-boards"]

# Mapper 96, the Bandai Oeka Kids board (MF-6c step 8): a 32 KiB PRG bank and a 16 KiB outer
# CHR bank from one CPU register, and a 4 KiB inner CHR-RAM bank **latched off the PPU address
# bus** on the entry into $2000-$2FFF -- including a bare $2006 write, which is 4.4's "not
# academic" distinction and MR-1's open MMC2 question answered for this board from its own
# page. Two titles, both drawing programs for the Oeka Kids tablet, which is a recorded gap:
# this build has no host surface for that peripheral. One `DecodeBoard` variant, in both
# PPU-bus latches, and one new forward, `on_ppu_address_bus`. Implies `board-decode-boards`.
board-96 = ["board-decode-boards"]

# Mapper 111, the Membler Industries GTROM / Cheapocabra board (MF-6c step 9) -- **parked**. One
# register
# at $5000-$5FFF and $7000-$7FFF with a 32 KiB PRG bank, an 8 KiB CHR-RAM bank, an 8 KiB
# nametable bank and two LEDs, and an SST39SF040 flash chip the game saves into. Seven
# homebrew titles. One `DecodeBoard` variant and three new forwards, because its two
# nametable banks are the **fourth** distinct body of the `Mapper::read_nametable` dispatch
# Q-123 once measured a cap of two on. The LEDs, the register's read side and the flash's
# persistence are recorded gaps; see `Cheapocabra`'s own note. Implies
# `board-decode-boards`.
#
# **Parked by MF-6c step 9 and un-parked by MF-CART step 5**, which is the whole point of that
# lot: the fifth `DecodeBoard` variant used to flip `Cartridge::default_cpu_read` into the dearer
# of its two layouts on `mmc5exram`, +7 456 756 instructions over 300 frames (**+0.066 %**) on a
# board this feature does not touch. That function no longer exists — MF-CART step 4 inlined it
# into `Cartridge::try_cpu_read` and the MMC5's own `try_read_prg` arm went out of line — so the
# variant costs nothing: re-measured on the fixed tree this feature is **`mmc5` −0.111 %** and
# worst ROM **+0.002 %**, against a tolerance of +0.02 %. Step 9's other finding stands and is
# why there is one feature here and not two: the board measured *without* its nametable banks
# gave the identical figure, which refutes the fourth `Mapper::read_nametable` body as the cause.
# See `docs/review/BOARD-FEATURES.md`, `docs/progress/MF-6c.md` step 9 and
# `docs/progress/MF-CART.md` step 5.
board-111 = ["board-decode-boards"]

# The Nintendo VS. System, single-screen, and the two mapper numbers that exist only on it: 99
# (the VS board itself, one `DecodeBoard` variant) and 151 (a VRC1 on a VS board, a parameter of
# the existing VRC1 and no variant at all). Lot MF-VS.
#
# One feature for the whole machine and not one per piece, because the pieces are not separable:
# the PPU's palette and its two RC2C05 register quirks, the coin slots, the service button and
# the eight DIP switches at $4016/$4017, the swapped sticks, the per-ROM table and the board all
# answer the same question — "is this image a VS. System?" — settled once at load
# (`crate::vs::VsSystem`). Turning any one of them off would leave a VS image running wrong
# rather than running as a NES.
#
# **Parked**, and the figures are MF-VS step 7's against `f1278f46`: every one of lot PR-1's
# thirteen ROMs is slower, `+0.026 %` (`mmc5`) to `+0.083 %` (`duelito`), set total
# `+36 862 173 (+0.046 %)`, and level 2 is `+0.034 %` to `+0.057 %` on all ten figures — against
# a tolerance of `+0.02 %` per ROM. **Gated off it costs nothing**: the same tree with this
# feature out of `default` is set total `+90 052 (+0.000 %)`, worst ROM `+0.001 %`, all five
# level-2 `core` figures `+0.000 %` and the worst `total` `smb3 +0.019 %`.
#
# Where the figure is: about a quarter of it is the `$2002` identifier (step 7's probe measured
# the feature without it at set total `+26 801 979`, `duelito` `+0.083 % → +0.034 %`), and the
# rest is `Ppu2C02::run_dots` and `Ppu2C02::background_fetch` — per-dot paths this lot does not
# touch — moving by +1.0 M to +2.4 M on every ROM, which is §5.14's lottery and not work.
# `Ppu2C02::read_pattern_planes` is **identical to the instruction** in all three builds.
board-vs-system = ["board-decode-boards"]

# Mappers 36, 132, 136, 147, 172 and 173 -- the TXC 05-00002-010 / Sachen JV001 protection ASIC,
# **one chip on six boards from four publishers** (MF-UNL-1 step 1). About twenty TXC, Idea-Tek,
# Super Mega and Sachen originals, *Strike Wolf*, *F-15 City War*, *Creatom*, *Venice Beach
# Volley*, *撲克精靈* and *未来小子* among them.
#
# One feature and one `DecodeBoard` variant for the whole family, which is §6.1 of
# `docs/review/UNL-census.md`'s finding read as `BOARD-FEATURES.md` note 1 asks: Mesen 2 builds
# five classes for these six numbers, and what differs between them is the CPU data-bus wiring,
# the accumulator width and which Output bits reach which banking pin -- fields of one board, on
# the `Namcot108` precedent. One forward this enum did not have, `try_read_prg`, because the
# protection register is at $4100. Implies `board-decode-boards`.
board-jv001 = ["board-decode-boards"]

# Mappers 150 and 243, Sachen's eight-register ASIC on the SA-015 / SA-630 and the SA-020A
# (MF-UNL-1 step 2). Fifteen Sachen titles -- *Tasac*, *Olympic I.Q.*, *Shogi Gakuen*,
# *Strategist*, *美女拳 - Honey Peach* among them.
#
# One feature and one `DecodeBoard` variant for both numbers, which is the granularity Mesen 2
# measures them at too (it builds one class, `Sachen74LS374N`, for the pair). An index port and a
# data port under mask $C101, three bits wide, with R0/R1/R3 stored and inert. One forward this
# enum did not have for a board of this shape, `nametable_page`, because R7's mode 0 is
# `S0-S0-S0-S1` -- a per-table layout no `NametableMirroring` can say. Implies
# `board-decode-boards`.
board-sachen-8reg = ["board-decode-boards"]

# Mapper 133, the Sachen 72008 / UNL-SA-72008 (MF-UNL-1 step 3): *Jovial Race* and the Joy Van
# release of *盜帥 - Master Chu and the Drunkard Hu*. One latch, `$4100: [.... .PCC]` under mask
# $E100. The page documents the number twice -- the 60-pin Sachen 3009 is a Namco-108 clone with
# an analog feedback path -- and says itself that "only the 72-pin variant requires emulation";
# `Sachen72008`'s own note records that choice. One `DecodeBoard` variant, no new forward.
# Implies `board-decode-boards`.
board-133 = ["board-decode-boards"]

# Mappers 79 and 146 -- American Video Entertainment's NINA-03 and NINA-06, and the 60-pin
# Sachen 3015 / SA-016 that nesdev's own page calls "functionally identical" to them
# (MF-UNL-3 step 1). The largest single catalogue in the census: about nineteen AVE titles,
# *Dudes with Attitude*, *Deathbots*, *Krazy Kreatures*, *Tiles of Fate*, *Impossible Mission
# II*, *Ultimate League Soccer* and *Wally Bear and the NO! Gang* among them, plus Sachen's
# *Magical Mathematics* and the Joy Van releases.
#
# One `DecodeBoard` variant and one register, `$4100: [.... PCCC]` under mask $E100 -- a 32 KiB
# PRG bank and an 8 KiB CHR bank. **FCEUX's extra CNROM switch at $8000-$FFFF is deliberately
# not implemented**: the page's own last line attributes a latch at $8000 to mapper **148** and
# gives this board "Bus conflicts: No", so a dump that needed it is a mislabelled mapper-3 image
# and its header is the fix. `Nina03`'s own note has the argument and a test pins the silence.
# Implies `board-decode-boards`.
#
# Measured with the lot's other seven against `452e8464` (MF-UNL-3 step 7): PR-1's thirteen ROMs
# worst `m1`/`oamstr` +0.003 %, set total +595 604 (+0.001 %); level 2 all five `core` inside at
# +0.000 %, three of them identical to the instruction, and **all five `total` inside too**,
# -0.012 % to +0.013 %. The lot's own source with the eight features out of `default` -- the
# emulation of the base commit -- is itself `smb3/total` +0.022 %, which is what that column's
# spread is. See `docs/review/BOARD-FEATURES.md`.
board-nina03 = ["board-decode-boards"]

# Lot MF-UNL-3's **seven single-latch boards**, one feature each and **one** `DecodeBoard`
