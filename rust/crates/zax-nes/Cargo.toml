[package]
name = "zax-nes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# One feature per board that raises any figure (owner's rule, 2026-11-06). Each gates its
# board's code, its `Board` variant or `const` monomorphisation, every dispatch arm, its
# `SUPPORTED_MAPPERS` entries, its `registry` arms, its `board_memory_sizes` arm, its
# save-state block and its tests. A board whose measured cost is inside the owner's tolerance
# (at most +0.02 % per ROM on both runs) is in `default`; one above it is left out, and
# `parked-boards` then enables all the left-out ones at once.
#
# `docs/review/BOARD-FEATURES.md` is the table: a row per feature, with the measured cost per
# ROM on both runs and the one command that flips it.
[features]
default = [
    "board-94",
    "board-105",
    "board-116",
    "board-119",
    "board-153",
    "board-155",
    "board-158",
    "board-mmc3-multicart",
    "board-namcot108",
    "board-small-boards",
]

# Mappers 76, 88, 95, 154 and 206, the Namco 108 / DxROM family: one board with four
# parameters, 45 titles (MF-6a step 1, which measured `smb3/core` +45 707 and `m4` +66 921).
board-namcot108 = []

# Mappers 33, 70, 75, 89, 93, 97, 140, 152, 184, 185 and 232 — the Taito TC0190, the Bandai
# 74161/7432, Konami VRC1, both Sunsoft-2 boards, the Irem TAM-S1, the Jaleco JF-11/14,
# Sunsoft-1, CNROM with the security diodes and the Camerica BF9096 — nine boards **sharing one
# `Board` variant**, which is what `SmallBoard`'s own note exists for. One feature for the
# family, because one variant is what the measurements of MF-6a steps 2, 3 and 4 priced.
board-small-boards = []

# Mapper 94, the HVC-UN1ROM: a wiring of the UxROM board, its bank field shifted two bits
# (MF-6a step 4). One title, *Senjou no Ookami*.
board-94 = []

# Mapper 155, the MMC1 on a board with no PRG-RAM disable wire (MF-6a step 4). MF-6a2 step 2
# traced that step's `mm2/core` +10 506 to this parameter exactly and then removed it with the
# two-mask idiom, which left `Mmc1::update_banks` five instructions *below* the reference.
board-155 = []

# Mapper 105, the Nintendo NES-EVENT board of *Nintendo World Championships 1990* (MF-6b step 3).
board-105 = []

# Mapper 158, Tengen's 800037: the RAMBO-1 with CHR A17 wired to CIRAM A10 (MF-6b step 5). One
# title, *Alien Syndrome*.
board-158 = []

# Mapper 116, the Gouder SOMARI-P and its Huang ASIC: three mapper implementations (a VRC2, an
# MMC3 and an MMC1) in one board with a supervisor register at $4100 (MF-6a3 step 4). Six
# unlicensed titles, *Somari the Adventurer* among them; REQ-CORE-101 makes the number optional
# and Q-130 question 1 is the decision to implement it.
board-116 = []

# Mapper 119, the Nintendo TQROM: *High Speed* and *Pin\*Bot*. A `const` parameter of the
# MMC3's board, with its CHR-RAM chip's select, its two `#[inline(never)]` fetch bodies and the
# 8 KiB in `board_memory_sizes` (MF-6a3 step 1).
board-119 = []

# Mappers 47 and 37, Nintendo's two MMC3 multicarts: *Super Spike V'Ball + Nintendo World Cup*
# and *Super Mario Bros. + Tetris + Nintendo World Cup*. One `const` monomorphisation of the
# same board with an outer register at $6000-$7FFF above its bank numbers (MF-6a3 step 1).
board-mmc3-multicart = []

# Mapper 153, the Bandai FCG board with an LZ93D50 and 8192 bytes of battery-backed WRAM
# (MF-6c step 1). One title, *Famicom Jump II: Saikyou no 7-nin*. Two bytes and three branches
# on `BandaiFcg`, which is mapper 16's board: no `Board` variant, no dispatch arm anywhere.
board-153 = []

# The umbrella: every board left out of `default` because it is above the tolerance. Empty
# while no board is parked, which is the state MF-6b ended in and MF-6a3 keeps -- the feature
# exists so that a later lot which does park one has the switch already wired, and so that
# `cargo test --features parked-boards` is a configuration this lot checks either way.
parked-boards = []

[dev-dependencies]
sha2 = "0.10"
zax-goldens = { path = "../zax-goldens" }
