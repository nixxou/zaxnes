# One feature per board that raises any figure (owner's rule, 2026-11-06). Each gates its
# board's code, its `Board` variant or `const` monomorphisation, every dispatch arm, its
# `SUPPORTED_MAPPERS` entries, its `registry` arms, its `board_memory_sizes` arm, its
# save-state block and its tests. A board whose measured cost is inside the owner's tolerance
# (at most +0.02 % per ROM on both runs) is in `default`; one above it is left out, and
# `parked-boards` then enables all the left-out ones at once.
