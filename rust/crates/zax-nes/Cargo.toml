# Mapper 163, the 南晶 (Nanjing) FC-001 -- the board of most of that publisher's catalogue, and the
# first of lot MF-UNL-5's three Chinese-RPG boards. Four write ports and one read port in
# $5000-$5FFF: a 32 KiB PRG bank composed from `$5000`, `$5200` and a mode bit of `$5300` (six bank
# bits, 2 MiB), a D0/D1 swap on the two bank ports, a feedback/protection latch at `$5100-$5101`
# read back **inverted** at `$5500-$5501`, 8 KiB of battery-backed PRG-RAM, and -- the mechanism
# that names the lot -- a **4 KiB CHR-RAM page latched off the PPU address bus**: CHR A12 becomes
# PPU A9 as it stood on the last rise of PPU A13, so the left pattern table draws the top half of
# any nametable and the right one the bottom half, whatever the scroll. Six original titles,
# *牧场物语 - Harvest Moon*, *水浒神兽*, *暗黑破坏神 - Diablo*, *轩辕剑外传 之 天之痕*,
# *Final Fantasy IV* and *雷电皇 比卡丘传说* among them.
#
# A `DecodeBoard` variant shared with the lot's other PPU-latched board, and the number is in both
# of the PPU watch lists of `cartridges::mod` -- the rise of A13 is an address change, which is the
# only thing `Mapper::on_ppu_address_bus` sees. Submapper 1's ADPCM chip is deferred with the rest
# of the expansion audio (census §7.2); `Mapper::expansion_audio_output` stays `None`.
board-163 = ["board-decode-boards"]

# Mapper 162, the 外星 (Waixing) FS304 -- the lot's second Chinese-RPG board and the same four
# write ports as `board-163` under the same masks, including the automatic 4 KiB CHR-RAM switch
# (CHR A12 from PPU A9, latched on the rise of PPU A13). What differs is the PRG composition: two
# mode bits in `$5300` instead of one, PRG A16 and A15 each with a source of their own, and a bank
# line on `$5100` where the FC-001 has its feedback latch -- which is exactly the difference each
# page's *Notes* tell a dumper to test for ("write $04 to $5300 and verify that $5100.1 changes the
# PRG bank"). No feedback register, no swap bit, 8 KiB of battery-backed PRG-RAM, hard-wired
# mirroring. Six original titles, *Mummy - 神鬼传奇*, *法老王 - Pharaoh*, *西游记后传* and
# *火焰纹章 - 圣战的系谱* among them, plus three 南晶 releases on the same board.
#
# **One `ChrWindowKind` and no new `Board` or `DecodeBoard` variant**: the number shares
