board-158 = []

# Mapper 116, the Gouder SOMARI-P and its Huang ASIC: three mapper implementations (a VRC2, an
# MMC3 and an MMC1) in one board with a supervisor register at $4100 (MF-6a3 step 4). Six
# unlicensed titles, *Somari the Adventurer* among them; REQ-CORE-101 makes the number optional
# and Q-130 question 1 is the decision to implement it.
board-116 = []

# Mapper 119, the Nintendo TQROM: *High Speed* and *Pin\*Bot*. A `const` parameter of the
# MMC3's board, with its CHR-RAM chip's select, its two `#[inline(never)]` fetch bodies and the
# 8 KiB in `board_memory_sizes` (MF-6a3 step 1). MF-UNL-2 step 1 generalised that parameter into
# the four of `Mmc3Board`'s `CHR_RAM_*` set -- the four columns of nesdev's *MMC3 with CHR ROM and
# CHR RAM* -- and this feature is still the whole mechanism: with it off no board of the family
# compiles at all.
board-119 = []

# Mappers 74, 192, 194 and 195 -- the Waixing 43-393/43-406/860908C, FS308, the unnamed board of
# *Dai-2-Ji Super Robot Taisen* and the Waixing FS303: the **other four members of mapper 119's
# own family**, an MMC3 with a CHR-RAM chip beside its CHR-ROM so that a game can draw Chinese
# characters (MF-UNL-2 step 2). Six Waixing originals and ports, *哥伦布传*, *甲A*,
# *第四次: 机器人大战* and *天神之剑* among them.
#
# One feature and four `const` monomorphisations of `Mmc3Board`, which is why it **implies
# `board-119`**: the mechanism is that feature's -- the chip select, the two `#[inline(never)]`
# fetch bodies, the byte of per-slot source flags -- and this one adds the rows of the family's
# page that were not here, plus 195's run-time GAL. One `IrqBoard` variant for the four, holding
# the inner enum `Mmc3ChrRamBoard`.
#
# Measured with the lot's other three against `186b5656` (MF-UNL-2 step 8): PR-1's thirteen ROMs
# worst `mm2` +0.001 %, set total -585 425 (-0.000 %), eight of thirteen below; level 2 all five
# `core` inside at +0.000 % to +0.001 %. The one figure outside the tolerance is `smb3/total`
# +0.039 %, which is Lua's `ltable.c` -- a pair of binaries with identical emulation moves it by
# -0.034 %. See `docs/review/BOARD-FEATURES.md`.
board-mmc3-chrram = ["board-119"]

# Mappers 114, 115, 121, 123, 182 and 187 -- the SuperGame/Hosenkan board and the Kasheng
# SFC-02B, A9711/A9713, UNL-H2288 and A98402: six MMC3 clones that add some of the same three
# things to the chip -- scrambled register addresses and indices, an outer 256 KiB CHR bank, and
# an NROM-like PRG override register (MF-UNL-2 step 3). About fourteen originals, *Aladdin*,
# *The Lion King*, *Boogerman*, the six Gouder titles Kasheng re-released, *Mortal Kombat 3*,
# *Street Fighter Zero 2* and *The King of Fighters 96* among them.
#
# One feature, one board with six wirings and one boxed `IrqBoard` variant, on the `Jv001`
# precedent: no number has all three additions and none has anything else. It is the first board
# to make `IrqBoard` forward `Mapper::try_read_prg`, which 121's protection array and 187's
# protection read need.
#
# Measured with the lot's other three against `186b5656` (MF-UNL-2 step 8): PR-1's thirteen ROMs
# worst `mm2` +0.001 %, set total -585 425 (-0.000 %), eight of thirteen below; level 2 all five
# `core` inside at +0.000 % to +0.001 %. The one figure outside the tolerance is `smb3/total`
# +0.039 %, which is Lua's `ltable.c` -- a pair of binaries with identical emulation moves it by
# -0.034 %. See `docs/review/BOARD-FEATURES.md`.
board-mmc3-scramble = []

# NES 2.0 mapper 263, the Rex Soft **UNL-KOF97** board (MF-UNL-2 step 4): an MMC3 clone with
