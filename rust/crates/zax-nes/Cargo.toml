board-149 = ["board-decode-boards"]

# Mapper 190, the Zemina board of *Magic Kid Googoo*: the one of the lot's seven with more than
# one window. A 16 KiB PRG bank at $8000-$BFFF whose **top bit is the address's A14** -- so
# $8000-$9FFF writes the low eight banks and $C000-$DFFF the high eight -- 16 KiB fixed to the
# **first** bank at $C000-$FFFF, and four 2 KiB CHR banks written at $A000-$BFFF with the
# address's A1-A0 picking the window. 8 KiB of RAM at $6000-$7FFF, which its *Banks* section
# states and `board_memory_sizes` therefore does too. The four CHR bytes live in the shared
# variant's one savestate block, as mapper 36's CHR latch lives in `Jv001`'s.
#
# Measured with the lot's other seven against `452e8464` (MF-UNL-3 step 7): PR-1's thirteen ROMs
# worst `m1`/`oamstr` +0.003 %, set total +595 604 (+0.001 %); level 2 all five `core` inside at
# +0.000 %, three of them identical to the instruction, and **all five `total` inside too**,
# -0.012 % to +0.013 %. The lot's own source with the eight features out of `default` -- the
# emulation of the base commit -- is itself `smb3/total` +0.022 %, which is what that column's
# spread is. See `docs/review/BOARD-FEATURES.md`.
board-190 = ["board-decode-boards"]

# Mappers 35, 90, 209 and 211, the J.Y. Company ASIC (晶太, Jingtai) -- one chip, four PCB
# configurations, and `docs/review/UNL-census.md` calls it "the only board in the plan needing
# **four** hooks at once": a CPU-cycle IRQ *and* an A12 scanline IRQ with a selectable clock
# source, an MMC4-style CHR latch, and nametables served from CHR-ROM. It carries thirteen of
# Hummer Team's unlicensed ports -- *Super Mario World*, *Aladdin*, *Final Fight 3*, *Tekken 2*,
# *Donkey Kong Country 4*, *Contra Spirits*, *Mortal Kombat II Special*, *Mickey Mania 7*, *Tiny
# Toon Adventures 6*, *Warioland II*, *Shin Samurai Spirits 2*, *Mighty Morphin' Power Rangers
# III* and *Super Aladdin* -- plus a hardware multiplier, an accumulator, four PRG and four CHR
# banking modes, Extended Mirroring and an 8 KiB PRG-ROM window at $6000-$7FFF.
#
# It is an `IrqBoard` variant, which is what makes the four hooks affordable: that enum already
# forwards every one of them for an earlier board, so `Board`'s own dispatches do not grow an arm.
# MF-UNL-4 step 1 priced the one Q-123 said was capped -- `Mapper::read_nametable` --
# at `Ppu2C02::read_nametable_inner` **80 instructions in all three test binaries, identical to
# the instruction**; `rust/docs/PERFORMANCE-HISTORY.md` section 5.18 has it.
board-jy-asic = []

# Mapper 163, the 南晶 (Nanjing) FC-001 -- the board of most of that publisher's catalogue, and the
# first of lot MF-UNL-5's three Chinese-RPG boards. Four write ports and one read port in
# $5000-$5FFF: a 32 KiB PRG bank composed from `$5000`, `$5200` and a mode bit of `$5300` (six bank
# bits, 2 MiB), a D0/D1 swap on the two bank ports, a feedback/protection latch at `$5100-$5101`
# read back **inverted** at `$5500-$5501`, 8 KiB of battery-backed PRG-RAM, and -- the mechanism
# that names the lot -- a **4 KiB CHR-RAM page latched off the PPU address bus**: CHR A12 becomes
# PPU A9 as it stood on the last rise of PPU A13, so the left pattern table draws the top half of
# any nametable and the right one the bottom half, whatever the scroll. Six original titles,
# *牧场物语 - Harvest Moon*, *水浒神兽*, *暗黑破坏神 - Diablo*, *轩辕剑外传 之 天之痕*,
# *Final Fantasy IV* and *雷电皇 比卡丘传说* among them.
#
# A `DecodeBoard` variant shared with the lot's other PPU-latched board, and the number is in both
# of the PPU watch lists of `cartridges::mod` -- the rise of A13 is an address change, which is the
# only thing `Mapper::on_ppu_address_bus` sees. Submapper 1's ADPCM chip is deferred with the rest
# of the expansion audio (census §7.2); `Mapper::expansion_audio_output` stays `None`.
board-163 = ["board-decode-boards"]

# **Not a board: one mechanism of `board-jy-asic`**, on the `board-68-chr-nametables` precedent and
# the owner's rule of 2026-11-06 ("A costly *mechanism* of a board ... is implemented too, behind
# its own feature if it costs more than the board itself").
#
# The J.Y. ASIC's MMC4-like CHR latch is in `default` -- `$D003` bit 7 and the two latches move on
# the PPU's address bus like any other board's register. What this feature adds is the **tile
# emitter's view** of it: `Mapper::chr_latch_state`, `set_chr_latch_state` and `advance_chr_latch`
# forwarded through `IrqBoard`, so that a 3D tile record of a mapper-90 game carries the pattern
# the hardware would show at that column rather than the bank the latch holds at capture time
# (REQ-CORE-039). It is the MMC2's and the MMC4's contract, offered to a third board.
#
# Three bodies in those three dispatches re-lay `Ppu2C02::run_dots` out, and that function is 57 %
# to 62 % of `NesCore::run_frame`. MF-UNL-4 step 7 measured four shapes against `16a30564`:
# the forwards as first written cost `mmc5` **+0.374 %** and `smb3` +0.229 %; `#[inline(never)]`
# on all three -- what this feature ships -- costs `metroid` **+0.030 %** with five of thirteen
# ROMs over the tolerance; a `chr_latch` latch on `Cartridge` costs `mmc5` +0.326 % while making
# ten ROMs *faster*; and not forwarding them at all is below the base commit on all thirteen.
#
# **With it off the emulation is identical**, which is why it can be a feature at all: `Mapper`'s
# defaults are 0, nothing and nothing, so the tile emitter saves 0, moves nothing and restores 0.
# Out of `default`, and **not** in `parked-boards` -- that umbrella is for left-out *boards*, and
# the two PPU features set the precedent for a mechanism asked for by name:
#
#     cargo build -p zax-nes --features board-jy-asic-tile-latch
board-jy-asic-tile-latch = ["board-jy-asic"]

# Mappers 157 and 159, the Bandai LZ93D50 boards with a serial EEPROM: the Datach Joint ROM
# System (an internal X24C02 and, on *Battle Rush*, an external X24C01) and the four X24C01 games
# (MF-6c step 3). REQ-CORE-100's mapper-16 row makes the EEPROM "P3"; MR-1's table records "no
# counterpart" against Mesen's three files, and `Eeprom24C0X` is it. One `Option` field on
# `BandaiFcg`, no `Board` variant and no dispatch arm but `try_read_prg`'s.
board-eeprom = []

# Mappers 80, 207, 82 and NES 2.0 552 — the Taito X1-005 and X1-017, the two boards whose WRAM
# is inside the ASIC (MF-6c step 2). Thirteen titles. Two more `SmallBoard` variants and no
# `Board` variant, plus three forwards that family did not have: `try_read_prg` and
# `prg_ram_enabled`, because these boards decode $6000-$7FFF themselves, and `nametable_page` for
# mapper 207's CIRAM A10. Implies `board-small-boards`, the enum they live in.
#
# **Parked by MF-6c step 2 and un-parked by MF-CART step 5.** What parked it was one hoisted
# instruction in `Cartridge::default_cpu_read` — `&self.board`, materialised above the inlined
# `Board::try_read_prg` jump table for that table's cold arms, so that it ran on every CPU read
# of the one board which maps PRG-RAM into $8000-$DFFF: +7 456 756 over 300 frames of
# `mmc5exram` per unit (**+0.066 %**), and by MF-CART step 1 these two variants were buying
# **three** units. MF-6c measured seven shapes of the boards' own code against it and the figure
# never moved by an instruction, because it was never theirs. MF-CART step 4 took that function
# out of existence, and re-measured on the fixed tree this feature is **`mmc5` −0.112 %** with a
# worst ROM of **+0.001 %**. See `docs/review/BOARD-FEATURES.md`, `docs/progress/MF-6c.md` steps
# 2 and 3, and `docs/progress/MF-CART.md` steps 1, 4 and 5.
board-taito-x1 = ["board-small-boards"]

# The umbrella: every board left out of `default` because it is above the tolerance. MF-6b and
# MF-6a3 both ended with it empty, and the feature existed so that a later lot which did park a
# board would have the switch already wired; MF-6c step 2 was that lot and put `board-taito-x1`
# in it, step 9 added `board-111`.
#
# **MF-CART step 5 emptied it again, and the switch stays wired for the same reason it was wired
# before.** Both entries were above the tolerance on one instruction of
# `Cartridge::default_cpu_read` and nothing of their own, that lot's step 4 removed the
# instruction, and re-measured on the fixed tree the two features are `mmc5` −0.112 % and
# −0.111 % with worst ROMs of +0.001 % and +0.002 %. A later lot that does park a board adds it
# here and nowhere else; `--features parked-boards` is then still the one flag that reaches
# every left-out board at once, and with the list empty it is a no-op that still builds, which
# the suites check (`--features parked-boards` is one of the three configurations every step
# runs).
#
# **MF-VS step 7 put `board-vs-system` in it**, so the umbrella is no longer empty: that feature's
# own note above has the figures, and `--features parked-boards` is the one flag that turns the
# VS. System on.
parked-boards = ["board-vs-system"]

# **Not a board: the PPU's exact sprite-evaluation pipeline** (lot MF-4e step 3). The owner's rule
# is written for boards but the reason behind it is the figure, so it is applied here unchanged.
#
# With this on, the sprite evaluation is the hardware's byte counter in two independently clocked
# halves against a second counter over the secondary OAM, and a `$2004` read during rendering
# answers from the OAM copy buffer instead of from `oam[oam_address]`. It wins three
# `AccuracyCoin` rows — `Address $2004 behavior`, `Arbitrary Sprite zero` and `Misaligned OAM
# behavior`, 129 → 132 / 147 — and it is **above the tolerance on both runs**: PR-1's thirteen are
# +0.041 % to +0.133 % on the eleven ROMs whose behaviour does not move (worst `metroid` +0.133 %),
# and all ten level-2 figures are above at +0.057 % to +0.127 %. So it is out of `default`, and
# **not dropped**: one flag gives the exact pipeline.
#
# It is deliberately **not** in `parked-boards`, which is the umbrella for left-out *boards*; a
# build that wants everything asks for both. `docs/review/BOARD-FEATURES.md` has the row and the
# command.
#
# The `$2007`-during-rendering rule of step 2 is **not** behind this: it has its own feature,
# `ppu-2007-render-read` below, which lot MF-4e-gate added. It was in every build when MF-4e
# shipped — the figure is +0.000 % to +0.005 % on the eleven — and R0 took it out of `default` on
# 2026-11-07 for what it changes on screen rather than for what it costs.
ppu-exact-sprite-eval = []

# **Not a board either: the `$2007`-during-rendering rule** (lot MF-4e step 2, gated by lot
# MF-4e-gate). With this on, a `$2007` access — the read *and* the register-7 write — made while
# the PPU is fetching moves `v` by a coarse X increment and a Y increment at once instead of by
# PPUCTRL's 1 or 32, and that borrowed increment reaches `v_row_next` but **not** `v_row_start`,
# which is what lets AMD-021 R2-005 criterion 2 hold with it (Q-125, Q-137). With it off,
# `Ppu2C02::increment_vram_address` is `11407930`'s body line for line.
#
# `AccuracyCoin` **128 → 129 / 147**, the row `PPU Misc. / $2007 read w/ rendering`; 132 with
# `ppu-exact-sprite-eval` beside it.
#
# **This one is not parked for a figure.** It measures +0.000 % to +0.005 % on the eleven ROMs of
# PR-1's set whose behaviour does not move, well inside the owner's +0.02 % tolerance. It is out of
# `default` because of **what it changes on screen**: R0's dense A/B of the 3D packs against v0.4.2
# (2026-11-07) found it moving the picture in the two games the owner watches most — *Super Mario
# Bros. 3*, 58 of 681 sampled frames over 5 dumps, and *Zelda II*, 18-19 of 1 001 over 2 — with and
# without a pack, and SMB3's split line under the widescreen hack is where the owner saw a bug the
# last time this rule shipped (lot MF-4d, backed out by MF-4d-fix). The owner validates it by eye
# before it is the default; until then the default build renders this path as v0.4.2 does.
#
# Not in `parked-boards`, for the reason `ppu-exact-sprite-eval` is not: that umbrella is for
# left-out *boards*. `docs/review/BOARD-FEATURES.md` has the row and the command.
ppu-2007-render-read = []

