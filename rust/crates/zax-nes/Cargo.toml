# registers at $6000-$6004 under mask $E007 -- "$6000: [CCCC CC..]", "$6001: [CCCC CCC.]",
# "$6002: [CCCC CCC.]", "$6003: [.... PPPP]", "$6004: [.... ...M]" -- driving **three CHR regions
# of unequal width** (4 KiB at $0000, 2 KiB at $1000, 2 KiB at $1800, all three from 1 KiB bank
# numbers the diagrams shift rather than mask), one switchable 8 KiB PRG window of four with the
