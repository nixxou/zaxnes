# The scramble is in the **ports and the register order** and nothing else: a select port at $8000,
# a data port at $A000 and a nametable port at $E000 under mask $E001 where the 206 has an even/odd
# pair, and eight register indices that are the 206's rotated by six (`RRR` names the 206's
# `(RRR + 6) mod 8`). Below the register file the board *is* the 206, window for window, so this is
# **one `bool` on `board-namcot108`'s board** and not a board -- the shape §7.2 asks for by name --
# and with the feature off `Namcot108` is byte for byte what MF-6a step 1 shipped. Implies
# `board-namcot108`.
#
# **Q-161** records the two things the page does not say and this build takes from the 206: the
# upper 16 KiB of PRG (fixed to the last two banks) and the low bit of the two 2 KiB CHR registers.
board-112 = ["board-namcot108"]

