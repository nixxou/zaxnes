#
# Measured with the lot's other seven against `452e8464` (MF-UNL-3 step 7): PR-1's thirteen ROMs
# worst `m1`/`oamstr` +0.003 %, set total +595 604 (+0.001 %); level 2 all five `core` inside at
# +0.000 %, three of them identical to the instruction, and **all five `total` inside too**,
# -0.012 % to +0.013 %. The lot's own source with the eight features out of `default` -- the
# emulation of the base commit -- is itself `smb3/total` +0.022 %, which is what that column's
# spread is. See `docs/review/BOARD-FEATURES.md`.
board-107 = ["board-decode-boards"]

# Mapper 143, the Sachen **TCA-01** of *Dancing Blocks* and *Magical Mathematics*: "an NROM
# circuit board with a simple form of protection", whose whole register section is a **read** --
# `A:[010. ...1 ..DD DDDD] -> [xxii iiii]`, the logical inversion of the **address**'s low six
# bits, with bits 7-6 open bus. The census asked for the inversion of the *written* bits; the
# page has no write side at all, and **Q-145** records that the page wins. The one board of this
# lot that needs a forward, `try_read_prg`, which `DecodeBoard` has carried since MF-UNL-1.
#
# Measured with the lot's other seven against `452e8464` (MF-UNL-3 step 7): PR-1's thirteen ROMs
# worst `m1`/`oamstr` +0.003 %, set total +595 604 (+0.001 %); level 2 all five `core` inside at
# +0.000 %, three of them identical to the instruction, and **all five `total` inside too**,
# -0.012 % to +0.013 %. The lot's own source with the eight features out of `default` -- the
# emulation of the base commit -- is itself `smb3/total` +0.022 %, which is what that column's
# spread is. See `docs/review/BOARD-FEATURES.md`.
board-143 = ["board-decode-boards"]

# Mapper 144, the **AGCI 50282** of *Death Race*: "a intentionally defective variant of the
# Color Dreams board (mapper 11)", with "a 300 Ω resistor ... between CPU D0 and the combination
# of mapper hardware and ROM" so that "only the ROM's least significant bit always wins bus
# conflicts". The register is mapper 11's `[CCCC PPPP]` and this build reads its two fields
# exactly as `ColorDreams` does; what the number adds is the latched value,
# `ROM[address] & (written | 1)` -- the page's own "most succinct" formula, which is the same
# function as its Nestopia candidate. **Not** on `registry::has_bus_conflicts`: that generic path
# would AND bit 0 away before the board could put the ROM's back. **Q-146** records all three of
# the page's candidates and the census's own figure, which none of them produces.
#
# Measured with the lot's other seven against `452e8464` (MF-UNL-3 step 7): PR-1's thirteen ROMs
# worst `m1`/`oamstr` +0.003 %, set total +595 604 (+0.001 %); level 2 all five `core` inside at
