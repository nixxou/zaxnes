# things to the chip -- scrambled register addresses and indices, an outer 256 KiB CHR bank, and
# an NROM-like PRG override register (MF-UNL-2 step 3). About fourteen originals, *Aladdin*,
# *The Lion King*, *Boogerman*, the six Gouder titles Kasheng re-released, *Mortal Kombat 3*,
# *Street Fighter Zero 2* and *The King of Fighters 96* among them.
#
# One feature, one board with six wirings and one boxed `IrqBoard` variant, on the `Jv001`
# precedent: no number has all three additions and none has anything else. It is the first board
# to make `IrqBoard` forward `Mapper::try_read_prg`, which 121's protection array and 187's
# protection read need.
#
# Measured with the lot's other three against `186b5656` (MF-UNL-2 step 8): PR-1's thirteen ROMs
# worst `mm2` +0.001 %, set total -585 425 (-0.000 %), eight of thirteen below; level 2 all five
# `core` inside at +0.000 % to +0.001 %. The one figure outside the tolerance is `smb3/total`
# +0.039 %, which is Lua's `ltable.c` -- a pair of binaries with identical emulation moves it by
# -0.034 %. See `docs/review/BOARD-FEATURES.md`.
board-mmc3-scramble = []

