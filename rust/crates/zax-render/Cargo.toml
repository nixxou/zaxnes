[package]
name = "zax-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An offscreen EGL context (Mesa surfaceless or pbuffer) for the tests and the harness. It is
# not part of the renderer's API, which takes the host's `glow::Context`; it lives here because
# this is the crate allowed to hold `unsafe` GL code (RUST-PORT-PLAN §2).
offscreen = ["dep:khronos-egl", "dep:libloading"]

[dependencies]
glow = "0.16"
png = "0.17"
thiserror = "2"
zax-engine3d = { path = "../zax-engine3d" }
zax-profiles = { path = "../zax-profiles" }
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
flate2 = "1"
zax-nes = { path = "../zax-nes" }
zax-render = { path = ".", features = ["offscreen"] }

[lints]
workspace = true
