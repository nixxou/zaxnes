<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaxnes</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  /* dvh: the height actually visible on a phone, under its browser's bars. */
  #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
  #status { position: fixed; left: 8px; bottom: 8px; opacity: .8; pointer-events: none; }
  #open { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
          background: rgba(0,0,0,.6); z-index: 10; }
  #open.shown { display: flex; }
  .panel { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
           background: #1b1d24; border: 1px solid #3a3e4a; border-radius: 10px; padding: 18px; box-sizing: border-box; }
  .panel h2 { margin: 0 0 12px; font-size: 18px; color: #ffd84a; }
  .panel h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #9aa0ad; }
  .rom { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 10px 12px; border-radius: 6px;
         border: 1px solid #3a3e4a; background: #252833; color: #eee; font: inherit; cursor: pointer; }
  .rom:hover, .rom:focus { border-color: #ffd84a; outline: none; }
  .rom small { color: #9aa0ad; margin-left: 6px; }
  #drop { margin-top: 6px; padding: 22px 12px; border: 2px dashed #4a4f5d; border-radius: 8px; text-align: center; color: #aab; }
  #drop.over, body.dragging #drop { border-color: #ffd84a; color: #fff; }
  .row { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; }
  .btn { padding: 9px 14px; border-radius: 6px; border: 1px solid #3a3e4a; background: #252833; color: #eee; font: inherit; cursor: pointer; }
  .btn.main { background: #ffd84a; color: #111; border-color: #ffd84a; }
  .empty { color: #777; font-style: italic; }
  #open-button { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 5;
                 padding: 5px 12px; border-radius: 14px; border: 1px solid #3a3e4a; background: rgba(27,29,36,.75);
                 color: #eee; font: 13px system-ui, sans-serif; cursor: pointer; opacity: .45; transition: opacity .2s; }
  #open-button:hover, #open-button:focus { opacity: 1; outline: none; }
  body.playing #open-button { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Chargement…</div>
<button id="open-button" title="Ouvrir une ROM">Ouvrir une ROM…</button>

<div id="open" role="dialog" aria-modal="true" aria-labelledby="open-title">
  <div class="panel">
    <h2 id="open-title">Ouvrir une ROM</h2>
    <h3>Incluses</h3>
    <div id="bundled"></div>
    <h3>Vos ROMs</h3>
    <div id="mine"></div>
    <h3>Depuis votre ordinateur</h3>
    <div id="drop">Déposez un fichier ici (.nes, .fds, .unf, .zip, .7z)</div>
    <div class="row">
      <button class="btn main" id="browse">Parcourir…</button>
      <button class="btn" id="cancel">Annuler</button>
    </div>
    <input type="file" id="file" accept=".nes,.fds,.unf,.unif,.zip,.7z" hidden>
  </div>
</div>

<script>
  // The user data folder of the program (SDL_GetPrefPath under Emscripten), kept in IndexedDB.
  const DATA = '/home/web_user/.local/share/Zaxnes';
  const ROMS = DATA + '/roms';
  // The exchange files with the program (rust/crates/zax-app/src/web_bridge.rs).
  const OPEN_REQUEST = '/zaxnes-web/open-request';
  const OPEN_ANSWER = '/zaxnes-web/open-answer';
  const STATE = '/zaxnes-web/state';
  // The ROMs shipped with the program (installed into ROMS by the program itself).
  const BUNDLED = [{ title: 'FlappyZaxNes', file: 'FlappyZaxNes.nes', note: 'démo 3D' }];
  const ROM_FILE = /\.(nes|fds|unf|unif|zip|7z)$/i;

  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  function fitCanvas() {
    // At most twice the CSS pixels: a phone's 3x screen would cost the 3D twice as much again.
    const r = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(canvas.clientWidth * r);
    canvas.height = Math.round(canvas.clientHeight * r);
  }
  fitCanvas();

  // --- Persistence: the whole user data folder lives in IndexedDB. ---
  let syncing = false, dirty = false;
  function save() {
    if (typeof FS === 'undefined' || !FS.syncfs) return;
    if (syncing) { dirty = true; return; }
    syncing = true;
    FS.syncfs(false, (err) => {
      syncing = false;
      if (err) console.warn('Zaxnes: saving to IndexedDB failed', err);
      if (dirty) { dirty = false; save(); }
    });
  }
  setInterval(save, 3000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  // --- The ROM dialogue. ---
  const dialog = document.getElementById('open');
  const fileInput = document.getElementById('file');
  function exists(path) { try { return FS.analyzePath(path).exists; } catch (e) { return false; } }
  function choose(path) {
    FS.mkdirTree('/zaxnes-web');
    FS.writeFile(OPEN_ANSWER, path);
    closeDialog();
    save();
  }
  function romButton(title, path, note) {
    const b = document.createElement('button');
    b.className = 'rom';
    b.textContent = title;
    if (note) { const s = document.createElement('small'); s.textContent = note; b.appendChild(s); }
    b.onclick = () => choose(path);
    return b;
  }
  function fillLists() {
    const bundled = document.getElementById('bundled');
    const mine = document.getElementById('mine');
    bundled.replaceChildren(); mine.replaceChildren();
    const shipped = new Set(BUNDLED.map((r) => r.file.toLowerCase()));
    for (const r of BUNDLED) bundled.appendChild(romButton(r.title, ROMS + '/' + r.file, r.note));
    let files = [];
    try { files = FS.readdir(ROMS).filter((f) => ROM_FILE.test(f) && !shipped.has(f.toLowerCase())); } catch (e) {}
    files.sort((a, b) => a.localeCompare(b));
    if (!files.length) {
      const p = document.createElement('div'); p.className = 'empty';
      p.textContent = 'Aucune pour l’instant : les ROMs que vous ouvrez restent ici.';
      mine.appendChild(p);
    }
    for (const f of files) mine.appendChild(romButton(f.replace(ROM_FILE, ''), ROMS + '/' + f));
  }
  function openDialog() { fillLists(); dialog.classList.add('shown'); document.getElementById('browse').focus(); }
  function closeDialog() { dialog.classList.remove('shown'); canvas.focus(); }
  document.getElementById('cancel').onclick = closeDialog;
  document.getElementById('open-button').onclick = (e) => { e.currentTarget.blur(); openDialog(); };
  document.getElementById('browse').onclick = () => fileInput.click();
  dialog.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeDialog(); } });
  fileInput.onchange = () => { if (fileInput.files[0]) importRom(fileInput.files[0]); fileInput.value = ''; };

  // A file of the player's machine: copied into the ROM folder (so it stays), then opened.
  async function importRom(file) {
    if (!ROM_FILE.test(file.name)) { alertBox('Ce fichier n’est pas une ROM reconnue : ' + file.name); return; }
    const name = file.name.replace(/[\/\\]/g, '_');
    const bytes = new Uint8Array(await file.arrayBuffer());
    FS.mkdirTree(ROMS);
    FS.writeFile(ROMS + '/' + name, bytes);
    choose(ROMS + '/' + name);
  }
  function alertBox(text) { status.textContent = text; status.style.display = 'block'; setTimeout(() => status.textContent = '', 5000); }

  // Drop anywhere on the page, dialogue open or not.
  const drop = document.getElementById('drop');
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    const file = e.dataTransfer && e.dataTransfer.files[0];
    if (file && typeof FS !== 'undefined') importRom(file);
  });

  // The program's keys are the program's: Ctrl+O must not open the browser's own file dialogue,
  // Ctrl+S save the page, Tab move the focus, F1 open the help... (the program still gets them).
  window.addEventListener('keydown', (e) => {
    if (dialog.classList.contains('shown')) return;
    // Tab and F1 open the console interface's menu: not the browser's focus move or help.
    const programKey = e.key === 'Tab' || /^F([1-9]|10)$/.test(e.key);
    if (programKey || ((e.ctrlKey || e.metaKey) && /^[a-z,]$/i.test(e.key))) {
      e.preventDefault();
    }
  }, true);

  // --- ?play=<URL of a ROM> ---
  // The URL may be given encoded (encodeURIComponent) or as it is: a value that starts with
  // http(s):// takes the rest of the address, '&', '?' and '#' included, so a link pasted raw
  // still works. Put `play` last then (any `env` before it).
  function playUrl() {
    const search = location.search;
    const at = search.search(/[?&]play=/);
    if (at < 0) return null;
    let raw = search.slice(at + 6) + location.hash;
    if (/^https?%3A/i.test(raw)) {
      const end = raw.indexOf('&');
      try { raw = decodeURIComponent(end < 0 ? raw : raw.slice(0, end)); } catch (e) { return null; }
    }
    return /^https?:\/\//i.test(raw) ? raw : null;
  }
  // The file's name: the server's (Content-Disposition), else the URL's last segment; given the
  // extension its first bytes say when it has none the program knows.
  function romName(url, response, bytes) {
    let name = '';
    const disposition = response.headers.get('Content-Disposition') || '';
    const match = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(disposition);
    if (match) { try { name = decodeURIComponent(match[1]); } catch (e) { name = match[1]; } }
    // The last segment of a path, or of a query value naming a file, decoded.
    const lastPart = (text) => {
      let part = (text || '').split(/[\/\\]/).pop() || '';
      try { part = decodeURIComponent(part); } catch (e) { /* kept as it is */ }
      return part;
    };
    if (!name) {
      // The URL given first (a redirection, as archive.org's to view_archive.php, says less),
      // then a `file=` of the final URL, then its path; the first that names a ROM, else the last.
      const candidates = [];
      try { candidates.push(lastPart(new URL(url).pathname)); } catch (e) { /* not a URL */ }
      try {
        const final = new URL(response.url || url);
        candidates.push(lastPart(final.searchParams.get('file')), lastPart(final.pathname));
      } catch (e) { /* not a URL */ }
      name = candidates.find((part) => ROM_FILE.test(part))
        || candidates.find((part) => part && !/\.(php|aspx?|cgi|html?)$/i.test(part)) || '';
    }
    name = name.replace(/[\/\\:*?"<>|]/g, '_').trim() || 'rom';
    if (!ROM_FILE.test(name)) {
      const head = String.fromCharCode(...bytes.slice(0, 6));
      name += head.startsWith('PK\x03\x04') ? '.zip'
        : head === '7z\xbc\xaf\x27\x1c' ? '.7z'
        : head.startsWith('FDS\x1a') ? '.fds' : head.startsWith('UNIF') ? '.unf' : '.nes';
    }
    return name;
  }
  async function playRemote(url) {
    status.style.display = 'block';
    status.textContent = 'Téléchargement de la ROM…';
    let response;
    try {
      response = await fetch(url);
    } catch (e) {
      // A network error, or a server that does not allow other sites to read its files (CORS):
      // the browser does not tell the two apart.
      alertBox('ROM inaccessible : le site qui l’héberge ne permet pas à une autre page de la '
        + 'télécharger (CORS), ou l’adresse ne répond pas. ' + url);
      return;
    }
    if (!response.ok) { alertBox('ROM introuvable (' + response.status + ') : ' + url); return; }
    const bytes = new Uint8Array(await response.arrayBuffer());
    if (bytes.length < 16 || bytes.length > 64 * 1024 * 1024) { alertBox('Ce fichier n’est pas une ROM : ' + url); return; }
    const name = romName(url, response, bytes);
    FS.mkdirTree(ROMS);
    FS.writeFile(ROMS + '/' + name, bytes);
    status.textContent = '';
    choose(ROMS + '/' + name);
  }

  // The program asks for the dialogue by creating OPEN_REQUEST.
  function pollRequests() {
    if (exists(OPEN_REQUEST)) {
      try { FS.unlink(OPEN_REQUEST); } catch (e) {}
      openDialog();
    }
    // The page's own button only while no game is on the screen.
    let state = '';
    try { state = FS.readFile(STATE, { encoding: 'utf8' }); } catch (e) {}
    document.body.classList.toggle('playing', state === 'playing');
  }

  var Module = {
    canvas,
    arguments: [],
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => { status.textContent = t; },
    onRuntimeInitialized: () => {
      status.textContent = '';
      canvas.focus();
      setInterval(pollRequests, 200);
      // ?play=https://... : a ROM on the web, downloaded into the ROM folder, then played.
      const remote = playUrl();
      if (remote) { playRemote(remote); return; }
      // ?play=flappy (the README's link): straight into a bundled ROM, once the program has
      // installed it.
      const wanted = (new URLSearchParams(location.search).get('play') || '').toLowerCase();
      const rom = wanted && BUNDLED.find((r) => r.title.toLowerCase().includes(wanted));
      if (rom) {
        const path = ROMS + '/' + rom.file;
        const tryOpen = (left) => {
          if (exists(path)) { FS.mkdirTree('/zaxnes-web'); FS.writeFile(OPEN_ANSWER, path); }
          else if (left > 0) setTimeout(() => tryOpen(left - 1), 250);
        };
        setTimeout(() => tryOpen(40), 300);
      }
    },
    preRun: [() => {
      // Debugging aid: ?env=NAME=value (repeatable) sets environment variables of the program.
      for (const pair of new URLSearchParams(location.search).getAll('env')) {
        const at = pair.indexOf('=');
        if (at > 0) ENV[pair.slice(0, at)] = pair.slice(at + 1);
      }
      // The user data folder from IndexedDB, before the program starts.
      FS.mkdirTree(DATA);
      FS.mount(Module.IDBFS || IDBFS, {}, DATA);
      addRunDependency('zaxnes-idbfs');
      FS.syncfs(true, (err) => {
        if (err) console.warn('Zaxnes: reading IndexedDB failed', err);
        removeRunDependency('zaxnes-idbfs');
      });
      // The interface's face (Roboto, Apache-2.0, as on Android): the program looks for the
      // system's faces and a page has none, so they are put where Android keeps them. Without
      // them the program falls back to its built-in face.
      FS.mkdirTree('/system/fonts');
      for (const face of ['Roboto-Regular.ttf', 'Roboto-Bold.ttf']) {
        const dependency = 'zaxnes-font-' + face;
        addRunDependency(dependency);
        fetch('fonts/' + face)
          .then((response) => (response.ok ? response.arrayBuffer() : Promise.reject(response.status)))
          .then((data) => FS.writeFile('/system/fonts/' + face, new Uint8Array(data)))
          .catch((err) => console.warn('Zaxnes: font ' + face + ' not loaded', err))
          .finally(() => removeRunDependency(dependency));
      }
    }],
  };
  window.addEventListener('error', (e) => { status.textContent = 'Erreur : ' + e.message; });
</script>
<script async src="zaxnes.js"></script>
</body>
</html>
