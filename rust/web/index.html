<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaxnes</title>
<style>
  /* The page's own text in the interface's face (rust/web/fonts). */
  @font-face { font-family: Roboto; src: url(fonts/Roboto-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Roboto; src: url(fonts/Roboto-Bold.ttf); font-weight: 700; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #ddd; font: 14px Roboto, system-ui, sans-serif; }
  /* dvh: the height actually visible on a phone, under its browser's bars. */
  #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
  #status { position: fixed; left: 8px; bottom: 8px; opacity: .8; pointer-events: none; max-width: calc(100vw - 16px); }
  .dialog { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,.6); z-index: 10; }
  .dialog.shown { display: flex; }
  .panel { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
           background: #1b1d24; border: 1px solid #3a3e4a; border-radius: 10px; padding: 18px; box-sizing: border-box; }
  .panel h2 { margin: 0 0 12px; font-size: 18px; color: #ffd84a; }
  .panel h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #9aa0ad; }
  .panel p { margin: 4px 0; color: #aab; }
  .rom { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 10px 12px; border-radius: 6px;
         border: 1px solid #3a3e4a; background: #252833; color: #eee; font: inherit; cursor: pointer; }
  .rom:hover, .rom:focus { border-color: #ffd84a; outline: none; }
  .rom small { color: #9aa0ad; margin-left: 6px; }
  .drop { margin-top: 6px; padding: 18px 12px; border: 2px dashed #4a4f5d; border-radius: 8px; text-align: center; color: #aab; }
  body.dragging .drop { border-color: #ffd84a; color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; margin-top: 12px; }
  .row .grow { flex: 1; }
  .btn { padding: 9px 14px; border-radius: 6px; border: 1px solid #3a3e4a; background: #252833; color: #eee; font: inherit; cursor: pointer; }
  .btn:hover, .btn:focus { border-color: #ffd84a; outline: none; }
  .btn.main { background: #ffd84a; color: #111; border-color: #ffd84a; }
  .btn.small { padding: 4px 9px; font-size: 12px; }
  .btn.danger:hover { border-color: #ff6b6b; color: #ff9b9b; }
  input.url { flex: 1; min-width: 180px; padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3e4a;
              background: #12141a; color: #eee; font: inherit; }
  .empty { color: #777; font-style: italic; }
  .messages { margin-top: 10px; }
  .messages div { padding: 6px 10px; margin: 4px 0; border-radius: 6px; word-break: break-word; }
  .messages .ok { background: #1f3a26; color: #9fe0ad; }
  .messages .error { background: #42201f; color: #ffb3ad; }
  .messages .info { background: #23283a; color: #b8c4e8; }
  table.storage { width: 100%; border-collapse: collapse; }
  table.storage td { padding: 6px 4px; border-bottom: 1px solid #2a2d38; vertical-align: middle; }
  table.storage td.size { text-align: right; color: #ccd; white-space: nowrap; }
  table.storage td.act { text-align: right; white-space: nowrap; }
  table.storage td.name { word-break: break-all; }
  #bar { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 6px;
         opacity: .45; transition: opacity .2s; }
  #bar:hover, #bar:focus-within { opacity: 1; }
  #bar button { padding: 5px 12px; border-radius: 14px; border: 1px solid #3a3e4a; background: rgba(27,29,36,.75);
                color: #eee; font: 13px Roboto, system-ui, sans-serif; cursor: pointer; }
  body.playing #bar { display: none; }
  /* The progress window (owner request): over the dialogues. */
  #dlg-progress { z-index: 20; }
  .steps { margin: 6px 0; }
  .steps div { padding: 5px 0; display: flex; gap: 10px; align-items: baseline; }
  .steps .mark { width: 18px; text-align: center; flex: none; }
  .steps .run .mark { color: #ffd84a; }
  .steps .ok .mark { color: #7bd88f; }
  .steps .fail .mark { color: #ff8a80; }
  .steps .detail { color: #9aa0ad; margin-left: auto; white-space: nowrap; }
  .bar { height: 8px; background: #2a2d38; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .bar div { height: 100%; width: 0; background: #ffd84a; transition: width .15s; }
  .bar.busy div { width: 30%; animation: busy 1.1s ease-in-out infinite; }
  @keyframes busy { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .final { margin-top: 10px; font-weight: 600; }
  .final.ok { color: #9fe0ad; } .final.error { color: #ffb3ad; }
  /* The game pages (owner request): a list of a page's games, downloaded when played. */
  details.library { margin: 6px 0; border: 1px solid #3a3e4a; border-radius: 6px; background: #20232c; }
  details.library summary { padding: 9px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  details.library summary .grow { flex: 1; word-break: break-all; }
  details.library .inner { padding: 0 10px 10px; }
  details.library input.filter { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 7px 9px; border-radius: 6px;
    border: 1px solid #3a3e4a; background: #12141a; color: #eee; font: inherit; }
  details.library .games { max-height: 320px; overflow: auto; }
  details.library .rom small.got { color: #7bd88f; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status"></div>
<div id="bar">
  <button id="bar-rom" data-t="barRom"></button>
  <button id="bar-profile" data-t="barProfile"></button>
  <button id="bar-storage" data-t="barStorage"></button>
</div>

<div class="dialog" id="dlg-rom" role="dialog" aria-modal="true">
  <div class="panel">
    <h2 data-t="romTitle"></h2>
    <h3 data-t="romBundled"></h3>
    <div id="bundled"></div>
    <h3 data-t="romMine"></h3>
    <div id="mine"></div>
    <h3 data-t="libraries"></h3>
    <p data-t="librariesText"></p>
    <div class="row">
      <input class="url" id="library-url" type="url" placeholder="https://…">
      <button class="btn" id="library-add" data-t="libraryAdd"></button>
    </div>
    <div id="libraries"></div>
    <h3 data-t="romComputer"></h3>
    <div class="drop" data-t="romDrop"></div>
    <div class="row">
      <button class="btn main" id="rom-browse" data-t="romBrowse"></button>
      <button class="btn" id="rom-import" data-t="romImport"></button>
    </div>
    <h3 data-t="fromUrl"></h3>
    <div class="row">
      <input class="url" id="rom-url" type="url" placeholder="https://…">
      <button class="btn" id="rom-url-go" data-t="download"></button>
    </div>
    <div class="messages" id="rom-messages"></div>
    <div class="row"><span class="grow"></span><button class="btn" data-close data-t="close"></button></div>
    <input type="file" id="rom-file-play" accept=".nes,.fds,.unf,.unif,.zip,.7z" hidden>
    <input type="file" id="rom-file-import" accept=".nes,.fds,.unf,.unif,.zip,.7z" multiple hidden>
  </div>
</div>

<div class="dialog" id="dlg-profile" role="dialog" aria-modal="true">
  <div class="panel">
    <h2 data-t="profileTitle"></h2>
    <p data-t="profileText"></p>
    <div class="drop" data-t="profileDrop"></div>
    <div class="row">
      <button class="btn main" id="profile-import" data-t="profileImport"></button>
    </div>
    <h3 data-t="fromUrl"></h3>
    <div class="row">
      <input class="url" id="profile-url" type="url" placeholder="https://…">
      <button class="btn" id="profile-url-go" data-t="download"></button>
    </div>
    <div class="messages" id="profile-messages"></div>
    <div class="row"><span class="grow"></span><button class="btn" data-close data-t="close"></button></div>
    <input type="file" id="profile-file" accept=".3dn,.3dh,.bundle,.zip,.7z" multiple hidden>
  </div>
</div>

<div class="dialog" id="dlg-storage" role="dialog" aria-modal="true">
  <div class="panel">
    <h2 data-t="storageTitle"></h2>
    <p id="storage-summary"></p>
    <p id="storage-persist"></p>
    <div class="row" id="storage-persist-row"><button class="btn" id="storage-persist-go" data-t="persistAsk"></button></div>
    <h3 data-t="storageCategories"></h3>
    <table class="storage" id="storage-categories"></table>
    <h3 data-t="storageRoms"></h3>
    <table class="storage" id="storage-roms"></table>
    <div class="messages" id="storage-messages"></div>
    <div class="row">
      <button class="btn danger" id="storage-all" data-t="storageAll"></button>
      <button class="btn" data-close data-t="close"></button>
    </div>
  </div>
</div>

<div class="dialog" id="dlg-progress" role="dialog" aria-modal="true">
  <div class="panel">
    <h2 id="progress-title"></h2>
    <div class="steps" id="progress-steps"></div>
    <div class="bar" id="progress-bar"><div></div></div>
    <div class="final" id="progress-final"></div>
    <div class="row"><span class="grow"></span><button class="btn" id="progress-close" data-t="close"></button></div>
  </div>
</div>

<script>
  // The user data folder of the program (SDL_GetPrefPath under Emscripten), kept in IndexedDB.
  const DATA = '/home/web_user/.local/share/Zaxnes';
  const ROMS = DATA + '/roms';
  // Where the program imports 3D profiles and 3dSen data from (launch_request.rs, IMPORT_FOLDER).
  const IMPORT = DATA + '/import';
  // The user's 3D profiles.
  const PROFILES = DATA + '/profiles';
  // The exchange files with the program (rust/crates/zax-app/src/web_bridge.rs).
  const OPEN_REQUEST = '/zaxnes-web/open-request';
  const OPEN_ANSWER = '/zaxnes-web/open-answer';
  const IMPORT_RESULT = '/zaxnes-web/import-result';
  const STATE = '/zaxnes-web/state';
  // The ROMs shipped with the program (installed into ROMS by the program itself, once per
  // version: DEMO_MARKER says it was).
  const BUNDLED = [{ title: 'FlappyZaxNes', file: 'FlappyZaxNes.nes', noteKey: 'demo' }];
  const DEMO_MARKER = DATA + '/demo-game.txt';
  const ROM_FILE = /\.(nes|fds|unf|unif|zip|7z)$/i;
  // What the profile import takes: profiles, 3dSen's bundle, or an archive holding it (the
  // program looks for the bundle inside, rust/crates/zax-profiles/src/import/source.rs).
  const PROFILE_FILE = /\.(3dn|3dh|bundle|zip|7z)$/i;
  // Dropped anywhere, a zip or a 7z is a ROM; in the profile dialogue, a 3dSen archive.
  const PROFILE_ONLY_FILE = /\.(3dn|3dh|bundle)$/i;

  // --- Language: the program's (ui.language of its settings), else the browser's. ---
  const TEXT = {
    fr: {
      barRom: 'Ouvrir une ROM…', barProfile: 'Profils 3D…', barStorage: 'Stockage…',
      romTitle: 'Ouvrir une ROM', romBundled: 'Incluses', romMine: 'Vos ROMs', demo: 'démo 3D',
      romNone: 'Aucune pour l’instant : les ROMs que vous ouvrez ou importez restent ici.',
      romComputer: 'Depuis votre ordinateur', romDrop: 'Déposez un fichier ici (.nes, .fds, .unf, .zip, .7z)',
      romBrowse: 'Jouer un fichier…', romImport: 'Importer…', fromUrl: 'Depuis une adresse', download: 'Télécharger',
      close: 'Fermer',
      notRom: 'Ce fichier n’est pas une ROM reconnue : ', romImported: 'ROM importée : ',
      downloading: 'Téléchargement…', cors: 'Fichier inaccessible : le site qui l’héberge ne permet pas à une autre page de le télécharger (CORS), ou l’adresse ne répond pas. ',
      notFound: 'Fichier introuvable ', isPage: 'Cette adresse est une page web, pas un fichier : ', tooBig: 'Ce fichier n’a pas la taille d’une ROM : ', tooBigImport: 'Fichier trop gros pour un import (plus de 512 Mo) : ',
      profileTitle: 'Importer un profil 3D', profileText: 'Profils 3D (.3dn, .3dh), fichier de profils de 3dSen (.bundle), ou une archive .zip / .7z qui le contient (même tout un dossier de 3dSen) : ils rejoignent vos profils, celui d’un même identifiant est remplacé.',
      profileDrop: 'Déposez un fichier ici (.3dn, .3dh, .bundle, .zip, .7z)', profileImport: 'Importer…',
      notProfile: 'Ce fichier n’est ni un profil 3D ni des données 3dSen : ', importing: 'Import en cours : ',
      noAnswer: 'Le programme n’a pas répondu : l’import se fera à la prochaine ouverture de la liste des jeux.',
      storageTitle: 'Stockage du navigateur', storageCategories: 'Données', storageRoms: 'Vos ROMs',
      storageAll: 'Tout effacer', storageUsed: 'Zaxnes occupe ', storageQuota: ' ; le navigateur accorde à ce site jusqu’à ',
      persistOn: 'Stockage persistant : oui, le navigateur ne l’efface pas de lui-même.',
      persistOff: 'Stockage persistant : non, le navigateur peut l’effacer s’il manque de place.',
      persistAsk: 'Demander un stockage persistant', persistRefused: 'Le navigateur a refusé (il l’accorde souvent à un site installé ou souvent visité).',
      files: ' fichiers', clear: 'Vider', rename: 'Renommer', remove: 'Supprimer',
      confirmClear: 'Effacer « {0} » ? Cette action est définitive.', confirmAll: 'Effacer toutes les données de Zaxnes dans ce navigateur ? Cette action est définitive.',
      confirmRemove: 'Supprimer la ROM « {0} » et ses sauvegardes ?', renamePrompt: 'Nouveau nom de « {0} » :',
      renamed: 'Renommée : ', removed: 'Supprimée : ', cleared: 'Vidé : ', badName: 'Nom refusé : ', exists: 'Ce nom existe déjà : ',
      reloading: 'La page va se recharger pour en tenir compte…',
      cat_roms: 'ROMs', cat_saves: 'Sauvegardes d’état', cat_battery: 'Sauvegardes de cartouche', cat_profiles: 'Profils 3D',
      cat_tiles: 'Cache des tuiles 3D', cat_covers: 'Jaquettes', cat_movies: 'Films', cat_logs: 'Journaux',
      cat_settings: 'Réglages, touches et bibliothèque', cat_other: 'Autres',
      progressImport: 'Import de profils 3D', progressRom: 'Téléchargement d’une ROM',
      stepDownload: 'Téléchargement', stepRead: 'Lecture et décompression', stepImport: 'Import des profils',
      importedN: '{0} profil(s) importé(s).', importedNone: 'Aucun nouveau profil : ils étaient déjà là.',
      romReady: 'ROM prête : ', failed: 'Échec : ',
      cached: 'déjà téléchargé',
      libraries: 'Depuis une page de jeux', librariesText: 'L’adresse d’une page qui liste des jeux (archive.org…) : ses jeux s’ajoutent à la liste des jeux, chacun téléchargé seulement quand on le lance.',
      libraryAdd: 'Ajouter', libraryReading: 'Lecture de la page', libraryFound: '{0} jeu(x) trouvé(s).', libraryNone: 'Aucun lien vers un jeu sur cette page.',
      libraryFilter: 'Chercher un jeu…', libraryMore: '{0} autre(s) : affinez la recherche.', libraryRemove: 'Retirer', libraryRefresh: 'Relire',
      driveKey: 'Un dossier Google Drive ne peut être lu par une autre page que par l’API de Google Drive, qui demande une clé d’API (paramètre ?drivekey=).',
      gotLocal: 'téléchargé', importCached: 'Déjà importé depuis cette adresse, profils inchangés : rien à retélécharger.',
    },
    en: {
      barRom: 'Open a ROM…', barProfile: '3D profiles…', barStorage: 'Storage…',
      romTitle: 'Open a ROM', romBundled: 'Included', romMine: 'Your ROMs', demo: '3D demo',
      romNone: 'None yet: the ROMs you open or import stay here.',
      romComputer: 'From your computer', romDrop: 'Drop a file here (.nes, .fds, .unf, .zip, .7z)',
      romBrowse: 'Play a file…', romImport: 'Import…', fromUrl: 'From an address', download: 'Download',
      close: 'Close',
      notRom: 'This file is not a known ROM: ', romImported: 'ROM imported: ',
      downloading: 'Downloading…', cors: 'File out of reach: the site hosting it does not let another page download it (CORS), or the address does not answer. ',
      notFound: 'File not found ', isPage: 'This address is a web page, not a file: ', tooBig: 'This file does not have the size of a ROM: ', tooBigImport: 'File too big for an import (over 512 MB): ',
      profileTitle: 'Import a 3D profile', profileText: '3D profiles (.3dn, .3dh), 3dSen’s profiles file (.bundle), or a .zip / .7z archive holding it (even a whole 3dSen folder): they join your profiles, one of the same identifier is replaced.',
      profileDrop: 'Drop a file here (.3dn, .3dh, .bundle, .zip, .7z)', profileImport: 'Import…',
      notProfile: 'This file is neither a 3D profile nor 3dSen data: ', importing: 'Importing: ',
      noAnswer: 'The program did not answer: the import will happen when the list of games next opens.',
      storageTitle: 'Browser storage', storageCategories: 'Data', storageRoms: 'Your ROMs',
      storageAll: 'Erase everything', storageUsed: 'Zaxnes uses ', storageQuota: '; the browser grants this site up to ',
      persistOn: 'Persistent storage: yes, the browser does not erase it on its own.',
      persistOff: 'Persistent storage: no, the browser may erase it when space runs short.',
      persistAsk: 'Ask for persistent storage', persistRefused: 'The browser refused (it often grants it to an installed or often visited site).',
      files: ' files', clear: 'Clear', rename: 'Rename', remove: 'Remove',
      confirmClear: 'Erase “{0}”? This cannot be undone.', confirmAll: 'Erase all of Zaxnes’s data in this browser? This cannot be undone.',
      confirmRemove: 'Remove the ROM “{0}” and its saves?', renamePrompt: 'New name of “{0}”:',
      renamed: 'Renamed: ', removed: 'Removed: ', cleared: 'Cleared: ', badName: 'Name refused: ', exists: 'This name exists already: ',
      reloading: 'The page will reload to take it into account…',
      cat_roms: 'ROMs', cat_saves: 'Save states', cat_battery: 'Cartridge saves', cat_profiles: '3D profiles',
      cat_tiles: '3D tile cache', cat_covers: 'Covers', cat_movies: 'Movies', cat_logs: 'Logs',
      cat_settings: 'Settings, keys and library', cat_other: 'Other',
      progressImport: 'Importing 3D profiles', progressRom: 'Downloading a ROM',
      stepDownload: 'Downloading', stepRead: 'Reading and unpacking', stepImport: 'Importing the profiles',
      importedN: '{0} profile(s) imported.', importedNone: 'No new profile: they were there already.',
      romReady: 'ROM ready: ', failed: 'Failed: ',
      cached: 'downloaded already',
      libraries: 'From a page of games', librariesText: 'The address of a page listing games (archive.org…): its games join the list of games, each downloaded only when it is played.',
      libraryAdd: 'Add', libraryReading: 'Reading the page', libraryFound: '{0} game(s) found.', libraryNone: 'No link to a game on this page.',
      libraryFilter: 'Search a game…', libraryMore: '{0} more: narrow the search.', libraryRemove: 'Remove', libraryRefresh: 'Read again',
      driveKey: 'A Google Drive folder can be read by another page only through the Google Drive API, which needs an API key (parameter ?drivekey=).',
      gotLocal: 'downloaded', importCached: 'Imported from this address already, profiles unchanged: nothing to download again.',
    },
  };
  let lang = (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
  function t(key, arg) { return (TEXT[lang][key] || TEXT.en[key] || key).replace('{0}', arg ?? ''); }
  function applyLanguage() {
    try {
      const settings = JSON.parse(FS.readFile(DATA + '/settings.json', { encoding: 'utf8' }));
      const chosen = settings && settings.values && settings.values['ui.language'];
      if (typeof chosen === 'string' && chosen) lang = chosen.toLowerCase().startsWith('fr') ? 'fr' : 'en';
    } catch (e) { /* no settings yet: the browser's language */ }
    document.documentElement.lang = lang;
    for (const node of document.querySelectorAll('[data-t]')) node.textContent = t(node.dataset.t);
  }
  applyLanguage();

  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  function fitCanvas() {
    // At most twice the CSS pixels: a phone's 3x screen would cost the 3D twice as much again.
    const r = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(canvas.clientWidth * r);
    canvas.height = Math.round(canvas.clientHeight * r);
  }
  fitCanvas();
  function alertBox(text) { status.textContent = text; setTimeout(() => { if (status.textContent === text) status.textContent = ''; }, 6000); }

  // --- Persistence: the whole user data folder lives in IndexedDB. ---
  let syncing = false, dirty = false;
  function save() {
    if (typeof FS === 'undefined' || !FS.syncfs) return;
    if (syncing) { dirty = true; return; }
    syncing = true;
    FS.syncfs(false, (err) => {
      syncing = false;
      if (err) console.warn('Zaxnes: saving to IndexedDB failed', err);
      if (dirty) { dirty = false; save(); }
    });
  }
  function saveThen(next) {
    if (syncing) { setTimeout(() => saveThen(next), 100); return; }
    syncing = true;
    FS.syncfs(false, (err) => { syncing = false; if (err) console.warn('Zaxnes: saving failed', err); next(); });
  }
  setInterval(save, 3000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  // --- File system helpers. ---
  function exists(path) { try { return FS.analyzePath(path).exists; } catch (e) { return false; } }
  function isDir(path) { try { return FS.isDir(FS.stat(path).mode); } catch (e) { return false; } }
  function list(path) { try { return FS.readdir(path).filter((n) => n !== '.' && n !== '..'); } catch (e) { return []; } }
  function walk(path, each) {
    for (const name of list(path)) {
      const full = path + '/' + name;
      if (isDir(full)) walk(full, each); else { try { each(full, FS.stat(full).size); } catch (e) {} }
    }
  }
  function removeTree(path) {
    if (!exists(path)) return;
    if (!isDir(path)) { FS.unlink(path); return; }
    for (const name of list(path)) removeTree(path + '/' + name);
    try { FS.rmdir(path); } catch (e) {}
  }
  function safeName(name) { return (name || '').replace(/[\/\\:*?"<>|\x00-\x1f]/g, '_').trim(); }
  function size(bytes) {
    const units = lang === 'fr' ? ['o', 'Ko', 'Mo', 'Go'] : ['B', 'KB', 'MB', 'GB'];
    let value = bytes, unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
    return (unit ? value.toFixed(value < 10 ? 1 : 0) : value) + ' ' + units[unit];
  }

  // --- Dialogs. ---
  const dialogs = {
    rom: document.getElementById('dlg-rom'),
    profile: document.getElementById('dlg-profile'),
    storage: document.getElementById('dlg-storage'),
  };
  function anyDialog() { return Object.values(dialogs).some((d) => d.classList.contains('shown')); }
  function showDialog(name) {
    applyLanguage();
    for (const [key, d] of Object.entries(dialogs)) d.classList.toggle('shown', key === name);
    if (name === 'rom') { fillRoms(); fillLibraries(); }
    if (name === 'storage') fillStorage();
    const first = dialogs[name].querySelector('.btn.main') || dialogs[name].querySelector('[data-close]');
    if (first) first.focus();
  }
  function closeDialogs() { for (const d of Object.values(dialogs)) d.classList.remove('shown'); canvas.focus(); }
  for (const d of Object.values(dialogs)) {
    d.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeDialogs(); } });
    for (const b of d.querySelectorAll('[data-close]')) b.onclick = closeDialogs;
  }
  function message(box, kind, text) {
    const div = document.createElement('div');
    div.className = kind;
    div.textContent = text;
    document.getElementById(box).prepend(div);
    return div;
  }
  function clearMessages(box) { document.getElementById(box).replaceChildren(); }
  document.getElementById('bar-rom').onclick = (e) => { e.currentTarget.blur(); showDialog('rom'); };
  document.getElementById('bar-profile').onclick = (e) => { e.currentTarget.blur(); clearMessages('profile-messages'); showDialog('profile'); };
  document.getElementById('bar-storage').onclick = (e) => { e.currentTarget.blur(); showDialog('storage'); };

  // --- The progress window (owner request): download, reading, then what came of it. ---
  const progressDialog = document.getElementById('dlg-progress');
  document.getElementById('progress-close').onclick = () => {
    progressDialog.classList.remove('shown');
    if (!anyDialog()) canvas.focus();
  };
  function progressWindow(title) {
    applyLanguage();
    document.getElementById('progress-title').textContent = title;
    const steps = document.getElementById('progress-steps');
    const bar = document.getElementById('progress-bar');
    const final = document.getElementById('progress-final');
    const close = document.getElementById('progress-close');
    steps.replaceChildren();
    final.textContent = ''; final.className = 'final';
    bar.style.display = ''; bar.classList.add('busy'); bar.firstChild.style.width = '';
    close.disabled = true;
    progressDialog.classList.add('shown');
    return {
      step(label) {
        const row = document.createElement('div');
        row.className = 'run';
        const mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = '…';
        const text = document.createElement('span'); text.textContent = label;
        const detail = document.createElement('span'); detail.className = 'detail';
        row.append(mark, text, detail);
        steps.appendChild(row);
        bar.classList.add('busy'); bar.firstChild.style.width = '';
        return {
          detail(value) { detail.textContent = value; },
          done() { row.className = 'ok'; mark.textContent = '✓'; },
          fail() { row.className = 'fail'; mark.textContent = '✗'; },
        };
      },
      // A share of the work done (0 to 1), or null for work of unknown length.
      bar(fraction) {
        if (fraction === null) { bar.classList.add('busy'); bar.firstChild.style.width = ''; return; }
        bar.classList.remove('busy');
        bar.firstChild.style.width = Math.round(Math.min(1, fraction) * 100) + '%';
      },
      finish(ok, text) {
        bar.style.display = 'none';
        final.className = 'final ' + (ok ? 'ok' : 'error');
        final.textContent = text;
        close.disabled = false;
        close.focus();
      },
      close() { progressDialog.classList.remove('shown'); },
    };
  }

  // --- Playing: the answer the program reads (web_bridge.rs), with the profile ?profile= asked. ---
  let wantedProfile = null;
  function play(path) {
    FS.mkdirTree('/zaxnes-web');
    FS.writeFile(OPEN_ANSWER, path + (wantedProfile ? '\nprofile=' + wantedProfile + '\n' : '\n'));
    wantedProfile = null;
    closeDialogs();
    save();
  }

  // --- The ROM dialogue. ---
  function romButton(title, path, note) {
    const b = document.createElement('button');
    b.className = 'rom';
    b.textContent = title;
    if (note) { const s = document.createElement('small'); s.textContent = note; b.appendChild(s); }
    b.onclick = () => play(path);
    return b;
  }
  function userRoms() {
    const shipped = new Set(BUNDLED.map((r) => r.file.toLowerCase()));
    return list(ROMS).filter((f) => ROM_FILE.test(f) && !shipped.has(f.toLowerCase())).sort((a, b) => a.localeCompare(b));
  }
  function fillRoms() {
    const bundled = document.getElementById('bundled');
    const mine = document.getElementById('mine');
    bundled.replaceChildren(); mine.replaceChildren();
    for (const r of BUNDLED) bundled.appendChild(romButton(r.title, ROMS + '/' + r.file, t(r.noteKey)));
    const files = userRoms();
    if (!files.length) {
      const p = document.createElement('div'); p.className = 'empty'; p.textContent = t('romNone');
      mine.appendChild(p);
    }
    for (const f of files) mine.appendChild(romButton(f.replace(ROM_FILE, ''), ROMS + '/' + f));
  }
  // A ROM's bytes kept in the ROM folder; its path.
  function storeRom(name, bytes) {
    FS.mkdirTree(ROMS);
    const path = ROMS + '/' + safeName(name);
    FS.writeFile(path, bytes);
    save();
    return path;
  }
  async function readRom(file) {
    if (!ROM_FILE.test(file.name)) throw new Error(t('notRom') + file.name);
    return storeRom(file.name, new Uint8Array(await file.arrayBuffer()));
  }
  const romPlayInput = document.getElementById('rom-file-play');
  const romImportInput = document.getElementById('rom-file-import');
  document.getElementById('rom-browse').onclick = () => romPlayInput.click();
  document.getElementById('rom-import').onclick = () => romImportInput.click();
  romPlayInput.onchange = async () => {
    const file = romPlayInput.files[0];
    romPlayInput.value = '';
    if (!file) return;
    try { play(await readRom(file)); } catch (e) { message('rom-messages', 'error', e.message); }
  };
  romImportInput.onchange = async () => {
    const files = [...romImportInput.files];
    romImportInput.value = '';
    for (const file of files) {
      try { await readRom(file); message('rom-messages', 'ok', t('romImported') + file.name); }
      catch (e) { message('rom-messages', 'error', e.message); }
    }
    fillRoms();
  };
  document.getElementById('rom-url-go').onclick = async () => {
    const url = document.getElementById('rom-url').value.trim();
    if (!url) return;
    const win = progressWindow(t('progressRom'));
    try {
      const { name, bytes } = await downloadStep(win, url, 'rom');
      storeRom(name, bytes);
      win.finish(true, t('romReady') + name);
      message('rom-messages', 'ok', t('romImported') + name);
      fillRoms();
    } catch (e) {
      if (e.page) { win.close(); addLibrary(url); return; }
      win.finish(false, e.message); message('rom-messages', 'error', e.message);
    }
  };

  // --- Downloads: ?play=, ?profile=, ?import= and the address fields. ---
  // The file's name: the server's (Content-Disposition), else the URL's; given the extension its
  // first bytes say when it has none the program knows.
  function remoteName(url, response, bytes, known) {
    let name = '';
    const disposition = response.headers.get('Content-Disposition') || '';
    const match = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(disposition);
    if (match) { try { name = decodeURIComponent(match[1]); } catch (e) { name = match[1]; } }
    const lastPart = (text) => {
      let part = (text || '').split(/[\/\\]/).pop() || '';
      try { part = decodeURIComponent(part); } catch (e) { /* kept as it is */ }
      return part;
    };
    if (!name) {
      // The URL given first (a redirection, as archive.org's to view_archive.php, says less),
      // then a `file=` of the final URL, then its path; the first that names a known file.
      const candidates = [];
      try { candidates.push(lastPart(new URL(url).pathname)); } catch (e) { /* not a URL */ }
      try {
        const final = new URL(response.url || url);
        candidates.push(lastPart(final.searchParams.get('file')), lastPart(final.pathname));
      } catch (e) { /* not a URL */ }
      name = candidates.find((part) => known.test(part))
        || candidates.find((part) => part && !/\.(php|aspx?|cgi|html?)$/i.test(part)) || '';
    }
    name = safeName(name) || 'file';
    if (!known.test(name)) {
      const head = String.fromCharCode(...bytes.slice(0, 6));
      name += head.startsWith('PK\x03\x04') ? '.zip'
        : head === '7z\xbc\xaf\x27\x1c' ? '.7z'
        : head.startsWith('FDS\x1a') ? '.fds' : head.startsWith('UNIF') ? '.unf'
        : known === PROFILE_FILE ? '.3dn' : '.nes';
    }
    return name;
  }
  // `onProgress(received, total)` follows the download, total 0 when the server does not say.
  // archive.org lets another page read a file only through its /cors/ address (its /download/
  // one redirects to a storage server that does not allow it); a file inside a zip, served by
  // its archive viewer, is allowed as it is.
  function readableUrl(url) {
    let u;
    try { u = new URL(url); } catch (e) { return url; }
    const direct = /^(?:www\.)?archive\.org$/i.test(u.hostname) ? /^\/download\/([^/]+)\/(.+)$/.exec(u.pathname)
      : /\.archive\.org$/i.test(u.hostname) ? /^\/\d+\/items\/([^/]+)\/(.+)$/.exec(u.pathname) : null;
    // A member of an archive (NES.zip/NES%2FGame.zip): the viewer, which allows it.
    if (!direct || /\.(zip|7z|rar|tar)\//i.test(direct[2])) return url;
    return 'https://archive.org/cors/' + direct[1] + '/' + direct[2] + u.search;
  }
  async function download(url, kind, onProgress) {
    let response;
    try { response = await fetch(readableUrl(url)); }
    catch (e) {
      // A network error, or a server that does not allow other sites to read its files (CORS):
      // the browser does not tell the two apart.
      throw new Error(t('cors') + url);
    }
    if (!response.ok) throw new Error(t('notFound') + '(' + response.status + ') : ' + url);
    const isPage = () => Object.assign(new Error(t('isPage') + url), { page: true });
    if (/text\/html|application\/xhtml/i.test(response.headers.get('Content-Type') || '')) throw isPage();
    const total = Number(response.headers.get('Content-Length')) || 0;
    // A ROM is at most a few MB; a 3dSen installation (an import) a hundred or so.
    const limit = kind === 'rom' ? 64 * 1024 * 1024 : 512 * 1024 * 1024;
    const tooBig = () => new Error(t(kind === 'rom' ? 'tooBig' : 'tooBigImport') + url);
    if (total > limit) throw tooBig();
    let bytes;
    if (response.body && response.body.getReader && onProgress) {
      const reader = response.body.getReader();
      const parts = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        received += value.length;
        if (received > limit) throw tooBig();
        onProgress(received, total);
      }
      bytes = new Uint8Array(received);
      let at = 0;
      for (const part of parts) { bytes.set(part, at); at += part.length; }
    } else {
      bytes = new Uint8Array(await response.arrayBuffer());
    }
    if (bytes.length < 16 || bytes.length > limit) throw tooBig();
    const head = new TextDecoder().decode(bytes.subarray(0, 64)).trimStart().toLowerCase();
    if (head.startsWith('<!doctype html') || head.startsWith('<html')) throw isPage();
    return { name: remoteName(url, response, bytes, kind === 'rom' ? ROM_FILE : PROFILE_FILE), bytes };
  }
  // The value of `key` in the address: an http(s) URL takes the rest of the parameter, '&' and
  // '#' included when it is the last one, so a link pasted raw still works; one given encoded
  // (encodeURIComponent) ends at the next '&'.
  function addressValues(key) {
    const search = location.search + location.hash;
    const values = [];
    const pattern = new RegExp('[?&]' + key + '=', 'g');
    let found;
    while ((found = pattern.exec(search))) {
      let raw = search.slice(found.index + found[0].length);
      if (/^https?:\/\//i.test(raw)) {
        const next = raw.search(/&(play|profile|import|library|drivekey|env)=/);
        values.push(next < 0 ? raw : raw.slice(0, next));
      } else {
        const end = raw.search(/[&#]/);
        raw = end < 0 ? raw : raw.slice(0, end);
        try { values.push(decodeURIComponent(raw.replace(/\+/g, ' '))); } catch (e) { values.push(raw); }
      }
    }
    return values;
  }

  // --- What was downloaded (owner request): a reload (F5) of an address with ?play= or
  // ?import= does not download again what is still there, unchanged. Kept in the user data
  // (IndexedDB): for a ROM its file and size, for an import the profile files it made and
  // their sizes. ---
  const DOWNLOADS = DATA + '/web-downloads.json';
  function downloads() {
    try { return JSON.parse(FS.readFile(DOWNLOADS, { encoding: 'utf8' })) || {}; } catch (e) { return {}; }
  }
  function rememberDownload(url, entry) {
    const all = downloads();
    all[url] = Object.assign({ at: Date.now() }, entry);
    // The 50 latest addresses.
    const kept = Object.entries(all).sort((a, b) => b[1].at - a[1].at).slice(0, 50);
    try { FS.writeFile(DOWNLOADS, JSON.stringify(Object.fromEntries(kept))); save(); } catch (e) {}
  }
  function fileSize(path) { try { return FS.stat(path).size; } catch (e) { return -1; } }
  // The ROM downloaded from `url` before, still there with its size; its path.
  function cachedRom(url) {
    const entry = downloads()[url];
    return entry && entry.kind === 'rom' && fileSize(entry.path) === entry.size ? entry.path : null;
  }
  // The import made from `url` before, its profile files still there with their sizes.
  function cachedImport(url) {
    const entry = downloads()[url];
    if (!entry || entry.kind !== 'import') return null;
    const unchanged = Object.entries(entry.files || {})
      .every(([name, bytes]) => fileSize(PROFILES + '/' + name) === bytes);
    return unchanged ? entry : null;
  }
  // The profile files and their sizes, to tell what an import made.
  function profileSizes() {
    const sizes = {};
    for (const name of list(PROFILES)) sizes[name] = fileSize(PROFILES + '/' + name);
    return sizes;
  }

  // --- Pages of games (owner request): a page's links to games, kept in the user data, each
  // game downloaded when it is played (then kept, as the ROMs of ?play=). ---
  const LIBRARIES = DATA + '/web-libraries.json';
  const GAME_LINK = /\.(nes|zip|7z|fds|unf|unif)$/i;
  // The profiles of 3dSen (zax-profiles installation.rs BUNDLE_PREFIX): a page of games that
  // links to it gives its 3D profiles too, not a game.
  const BUNDLE_LINK = /^defaultprofiles_assets_all_.*\.bundle$/i;
  function libraries() {
    try { return JSON.parse(FS.readFile(LIBRARIES, { encoding: 'utf8' })) || []; } catch (e) { return []; }
  }
  function saveLibraries(all) { try { FS.writeFile(LIBRARIES, JSON.stringify(all)); save(); } catch (e) {} }
  // The Drive API key: ?drivekey=, kept once given.
  function driveKey() {
    const given = addressValues('drivekey')[0];
    if (given) { try { FS.writeFile(DATA + '/web-drive-key.txt', given); } catch (e) {} return given; }
    try { return FS.readFile(DATA + '/web-drive-key.txt', { encoding: 'utf8' }).trim() || null; } catch (e) { return null; }
  }
  // The games of the page at `url`: [{ name, url }].
  async function readLibrary(url) {
    const folder = /drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([A-Za-z0-9_-]+)/.exec(url);
    if (folder) return readDriveFolder(folder[1]);
    let response;
    try { response = await fetch(url); } catch (e) { throw new Error(t('cors') + url); }
    if (!response.ok) throw new Error(t('notFound') + '(' + response.status + ') : ' + url);
    const page = new DOMParser().parseFromString(await response.text(), 'text/html');
    const base = response.url || url;
    const seen = new Set();
    const games = [];
    const bundles = [];
    for (const link of page.querySelectorAll('a[href]')) {
      let target;
      try { target = new URL(link.getAttribute('href'), base); } catch (e) { continue; }
      if (!/^https?:$/.test(target.protocol)) continue;
      // The file's name: the end of its path, or a file= of its query (archive.org's viewer).
      let name = target.pathname.split('/').pop() || '';
      const file = target.searchParams.get('file');
      if (file && GAME_LINK.test(file)) name = file.split('/').pop();
      try { name = decodeURIComponent(name); } catch (e) { /* kept as it is */ }
      name = name.split('/').pop();
      if (seen.has(target.href)) continue;
      if (BUNDLE_LINK.test(name)) { seen.add(target.href); bundles.push({ name, url: target.href }); continue; }
      if (!GAME_LINK.test(name)) continue;
      seen.add(target.href);
      games.push({ name, url: target.href });
    }
    return Object.assign(games, { bundles });
  }
  // A Google Drive folder, through the Drive API (its folder pages cannot be read from another
  // page); the files themselves download from drive.usercontent.google.com, which allows it.
  async function readDriveFolder(id) {
    const key = driveKey();
    if (!key) throw new Error(t('driveKey'));
    const games = [];
    let pageToken = '';
    do {
      const api = 'https://www.googleapis.com/drive/v3/files?pageSize=1000&fields=nextPageToken,files(id,name)'
        + '&q=' + encodeURIComponent("'" + id + "' in parents and trashed=false")
        + '&key=' + encodeURIComponent(key) + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const response = await fetch(api);
      if (!response.ok) throw new Error('Google Drive (' + response.status + ')');
      const data = await response.json();
      for (const f of data.files || []) {
        if (GAME_LINK.test(f.name)) {
          games.push({ name: f.name, url: 'https://drive.usercontent.google.com/download?id=' + f.id + '&export=download' });
        }
      }
      pageToken = data.nextPageToken || '';
    } while (pageToken);
    return games;
  }
  // The games of the pages not downloaded yet, for the program's list (web_bridge.rs
  // REMOTE_GAMES): it shows them with the ROMs, and asks for one when it is played.
  const REMOTE_GAMES = '/zaxnes-web/remote-games';
  const GAMES_CHANGED = '/zaxnes-web/games-changed';
  function publishRemoteGames() {
    const seen = new Set();
    const lines = [];
    for (const library of libraries()) {
      for (const game of library.games) {
        if (seen.has(game.url) || cachedRom(game.url)) continue;
        seen.add(game.url);
        const name = game.name.replace(GAME_LINK, '').replace(/[\t\r\n]/g, ' ');
        lines.push(name + '\t' + game.url.replace(/[\t\r\n]/g, ''));
      }
    }
    try {
      FS.mkdirTree('/zaxnes-web');
      FS.writeFile(REMOTE_GAMES, lines.join('\n') + '\n');
      FS.writeFile(GAMES_CHANGED, '1');
    } catch (e) {}
  }
  async function addLibrary(url, quiet) {
    const win = quiet ? null : progressWindow(t('libraries'));
    const step = win && win.step(t('libraryReading'));
    try {
      const games = await readLibrary(url);
      const bundles = games.bundles || [];
      if (!games.length && !bundles.length) throw new Error(t('libraryNone'));
      const all = libraries().filter((l) => l.url !== url);
      let title = url;
      try { const u = new URL(url); title = u.hostname + decodeURIComponent(u.pathname + u.search).slice(0, 80); } catch (e) {}
      all.unshift({ url, title, games: [...games], bundles, at: Date.now() });
      saveLibraries(all);
      publishRemoteGames();
      if (step) { step.detail(games.length + ''); step.done(); win.finish(true, t('libraryFound', games.length)); }
      fillLibraries(url);
      await importLibraryProfiles(url);
      return games;
    } catch (e) {
      if (step) { step.fail(); win.finish(false, e.message); } else alertBox(e.message);
      return null;
    }
  }
  // The 3D profiles of the 3dSen bundle a page links to, while the player has none of their
  // own (the built-in ones aside): downloaded and imported once, as an ?import= of it.
  function hasOwnProfiles() {
    // The program's own (web_bridge.rs SHIPPED_PROFILES): the demo's and the bundled ones.
    let shipped = [];
    try { shipped = FS.readFile('/zaxnes-web/shipped-profiles', { encoding: 'utf8' }).split('\n').map((n) => n.trim().toLowerCase()); } catch (e) {}
    return list(PROFILES).some((name) => /\.(3dn|3dh)$/i.test(name) && !shipped.includes(name.toLowerCase()));
  }
  async function importLibraryProfiles(url) {
    const library = libraries().find((l) => l.url === url);
    const bundle = library && (library.bundles || [])[0];
    if (!bundle || cachedImport(bundle.url)) return;
    // The program says which profiles are its own once it started (shipped-profiles).
    for (let i = 0; i < 100 && !exists('/zaxnes-web/shipped-profiles'); i++) await new Promise((r) => setTimeout(r, 100));
    if (hasOwnProfiles()) return;
    const win = progressWindow(t('progressImport'));
    try {
      const file = await downloadStep(win, bundle.url, 'profile');
      const before = profileSizes();
      const lines = (await importProfiles([file], win)) || [];
      const after = profileSizes();
      const made = {};
      for (const [name, bytes] of Object.entries(after)) if (before[name] !== bytes) made[name] = bytes;
      if (lines[0] && lines[0].ok) rememberDownload(bundle.url, { kind: 'import', id: lines[0].id, count: lines[0].count, files: made });
    } catch (e) { win.finish(false, e.message); }
  }
  // A game of a page: played from the copy downloaded before, else downloaded now.
  async function playFromLibrary(game, profile) {
    if (profile) wantedProfile = profile;
    const cached = cachedRom(game.url);
    if (cached) { play(cached); return; }
    const win = progressWindow(t('progressRom'));
    try {
      const { bytes } = await downloadStep(win, game.url, 'rom');
      win.close();
      const path = storeRom(game.name, bytes);
      rememberDownload(game.url, { kind: 'rom', path, size: bytes.length });
      // Now a ROM of the folder: out of the remote games.
      publishRemoteGames();
      play(path);
    } catch (e) { wantedProfile = null; win.finish(false, e.message); }
  }
  function fillLibraries(open) {
    const box = document.getElementById('libraries');
    box.replaceChildren();
    for (const library of libraries()) {
      const details = document.createElement('details');
      details.className = 'library';
      details.open = library.url === open;
      const summary = document.createElement('summary');
      const label = document.createElement('span'); label.className = 'grow';
      label.textContent = library.title + ' (' + library.games.length + ')';
      const refresh = document.createElement('button'); refresh.className = 'btn small'; refresh.textContent = t('libraryRefresh');
      refresh.onclick = (e) => { e.preventDefault(); addLibrary(library.url); };
      const remove = document.createElement('button'); remove.className = 'btn small danger'; remove.textContent = t('libraryRemove');
      remove.onclick = (e) => { e.preventDefault(); saveLibraries(libraries().filter((l) => l.url !== library.url)); publishRemoteGames(); fillLibraries(); };
      summary.append(label, refresh, remove);
      const inner = document.createElement('div'); inner.className = 'inner';
      const filter = document.createElement('input'); filter.className = 'filter'; filter.placeholder = t('libraryFilter');
      const games = document.createElement('div'); games.className = 'games';
      // The first 300 matches drawn: a page may list thousands.
      const draw = () => {
        const words = filter.value.toLowerCase().split(/\s+/).filter(Boolean);
        const matches = library.games.filter((g) => words.every((w) => g.name.toLowerCase().includes(w)));
        games.replaceChildren();
        for (const game of matches.slice(0, 300)) {
          const button = romButton(game.name.replace(GAME_LINK, ''), null, cachedRom(game.url) ? t('gotLocal') : '');
          const got = button.querySelector('small'); if (got) got.className = 'got';
          button.onclick = () => playFromLibrary(game);
          games.appendChild(button);
        }
        if (matches.length > 300) {
          const more = document.createElement('div'); more.className = 'empty'; more.textContent = t('libraryMore', matches.length - 300);
          games.appendChild(more);
        }
      };
      filter.oninput = draw;
      details.ontoggle = () => { if (details.open && !games.childElementCount) draw(); };
      if (details.open) draw();
      inner.append(filter, games);
      details.append(summary, inner);
      box.appendChild(details);
    }
  }
  document.getElementById('library-add').onclick = () => {
    const url = document.getElementById('library-url').value.trim();
    if (url) addLibrary(url);
  };

  // --- 3D profiles and 3dSen data: put in the import folder; the program imports them and
  // answers in IMPORT_RESULT (a line per file: ok|<id>|<text> or error||<text>). ---
  let importWaiters = [];
  // The files the page put there: once imported, they and their .done marker go (the browser's
  // storage is not kept full of them).
  let pageImports = [];
  function storeImports(files) {
    FS.mkdirTree(IMPORT);
    for (const { name, bytes } of files) {
      const path = IMPORT + '/' + safeName(name);
      // Put again: imported again.
      try { FS.unlink(path + '.done'); } catch (e) {}
      FS.writeFile(path, bytes);
      pageImports.push(path);
    }
    return new Promise((resolve) => {
      const waiter = { resolve, timer: setTimeout(() => {
        importWaiters = importWaiters.filter((w) => w !== waiter);
        resolve(null);
      }, 15000) };
      importWaiters.push(waiter);
    });
  }
  function takeImportResult() {
    if (!exists(IMPORT_RESULT)) return;
    let text = '';
    try { text = FS.readFile(IMPORT_RESULT, { encoding: 'utf8' }); FS.unlink(IMPORT_RESULT); } catch (e) { return; }
    const lines = text.split('\n').filter(Boolean).map((line) => {
      const [kind, id, count, ...rest] = line.split('|');
      return { ok: kind === 'ok', id: id || null, count: Number(count) || 0, text: rest.join('|') };
    });
    for (const path of pageImports) {
      if (!exists(path + '.done')) continue;
      try { FS.unlink(path); FS.unlink(path + '.done'); } catch (e) {}
    }
    pageImports = pageImports.filter((path) => exists(path));
    const waiters = importWaiters;
    importWaiters = [];
    for (const w of waiters) { clearTimeout(w.timer); w.resolve(lines); }
    if (!waiters.length) for (const l of lines) message('profile-messages', l.ok ? 'ok' : 'error', l.text);
    save();
  }
  // A download step of the window `win` for `url`: the percentage, or the size received.
  async function downloadStep(win, url, kind) {
    let shown = url.split('?')[0].split('/').pop() || url;
    try { shown = decodeURIComponent(shown); } catch (e) { /* kept as it is */ }
    const step = win.step(t('stepDownload') + ' : ' + shown);
    try {
      const file = await download(url, kind, (received, total) => {
        step.detail(total ? Math.round(received * 100 / total) + ' %' : size(received));
        win.bar(total ? received / total : null);
      });
      step.detail(size(file.bytes.length));
      step.done();
      return file;
    } catch (e) { step.fail(); throw e; }
  }
  // Imports `files` (profiles, bundles, archives) in the window `win`, opened by the caller
  // when it downloads first: the program reads them, then says how many profiles came.
  async function importProfiles(files, win) {
    const kept = [];
    for (const f of files) {
      if (PROFILE_FILE.test(f.name)) kept.push(f);
      else message('profile-messages', 'error', t('notProfile') + f.name);
    }
    if (!kept.length) { if (win) win.finish(false, t('notProfile') + files.map((f) => f.name).join(', ')); return null; }
    win = win || progressWindow(t('progressImport'));
    const step = win.step(/\.(zip|7z|bundle|assets)$/i.test(kept[0].name) ? t('stepRead') : t('stepImport'));
    step.detail(kept.map((f) => f.name).join(', '));
    win.bar(null);
    const lines = await storeImports(kept);
    if (!lines) {
      step.fail();
      win.finish(false, t('noAnswer'));
      message('profile-messages', 'info', t('noAnswer'));
      return null;
    }
    const ok = lines.every((l) => l.ok);
    const count = lines.reduce((sum, l) => sum + l.count, 0);
    if (ok) step.done(); else step.fail();
    for (const l of lines) message('profile-messages', l.ok ? 'ok' : 'error', l.text);
    const failures = lines.filter((l) => !l.ok).map((l) => l.text).join(' ; ');
    win.finish(ok && true, ok
      ? (count ? t('importedN', count) : t('importedNone'))
      : (count ? t('importedN', count) + ' ' : '') + t('failed') + failures);
    return lines;
  }
  const profileInput = document.getElementById('profile-file');
  document.getElementById('profile-import').onclick = () => profileInput.click();
  profileInput.onchange = async () => {
    const files = await Promise.all([...profileInput.files].map(async (f) => ({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) })));
    profileInput.value = '';
    await importProfiles(files);
  };
  document.getElementById('profile-url-go').onclick = async () => {
    const url = document.getElementById('profile-url').value.trim();
    if (!url) return;
    const win = progressWindow(t('progressImport'));
    try { const file = await downloadStep(win, url, 'profile'); await importProfiles([file], win); }
    catch (e) { win.finish(false, e.message); message('profile-messages', 'error', e.message); }
  };

  // Drop anywhere on the page: a ROM is played (or imported when the ROM dialogue is open), a
  // profile or 3dSen data imported.
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    if (typeof FS === 'undefined') return;
    const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
    const asProfile = dialogs.profile.classList.contains('shown') ? PROFILE_FILE : PROFILE_ONLY_FILE;
    const profiles = files.filter((f) => asProfile.test(f.name));
    const roms = files.filter((f) => !asProfile.test(f.name));
    if (profiles.length) {
      if (!dialogs.profile.classList.contains('shown')) { clearMessages('profile-messages'); showDialog('profile'); }
      const read = await Promise.all(profiles.map(async (f) => ({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) })));
      await importProfiles(read);
    }
    if (!roms.length) return;
    if (roms.length === 1 && !dialogs.rom.classList.contains('shown') && !profiles.length) {
      try { play(await readRom(roms[0])); } catch (err) { alertBox(err.message); }
      return;
    }
    if (!dialogs.rom.classList.contains('shown')) showDialog('rom');
    for (const f of roms) {
      try { await readRom(f); message('rom-messages', 'ok', t('romImported') + f.name); }
      catch (err) { message('rom-messages', 'error', err.message); }
    }
    fillRoms();
  });

  // --- Storage. ---
  const CATEGORIES = [
    { key: 'roms', dir: 'roms', reload: false },
    { key: 'saves', dir: 'saves', reload: false },
    { key: 'battery', dir: 'battery', reload: false },
    { key: 'profiles', dir: 'profiles', reload: true },
    { key: 'tiles', dir: 'tiles', reload: false },
    { key: 'covers', dir: 'covers', reload: true },
    { key: 'movies', dir: 'movies', reload: false },
    { key: 'logs', dir: 'logs', reload: false },
    { key: 'settings', dir: null, reload: true },
  ];
  // The category of a path of the user data folder.
  function categoryOf(path) {
    const relative = path.slice(DATA.length + 1);
    const top = relative.split('/')[0];
    const known = CATEGORIES.find((c) => c.dir === top);
    if (known) return known.key;
    return relative.includes('/') ? 'other' : 'settings';
  }
  function measure() {
    const sizes = {};
    for (const c of [...CATEGORIES.map((c) => c.key), 'other']) sizes[c] = { bytes: 0, files: 0 };
    walk(DATA, (path, bytes) => { const s = sizes[categoryOf(path)]; s.bytes += bytes; s.files++; });
    return sizes;
  }
  // Clears a category: the files of its folder, or the settings files of the root. The ROMs and
  // the profiles take the demo's marker with them, so the program installs FlappyZaxNes again.
  function clearCategory(key) {
    const shipped = new Set(BUNDLED.map((r) => r.file.toLowerCase()));
    walk(DATA, (path) => {
      if (categoryOf(path) !== key) return;
      if (key === 'roms' && shipped.has(path.split('/').pop().toLowerCase())) return;
      try { FS.unlink(path); } catch (e) {}
    });
    if (key === 'profiles' && exists(DEMO_MARKER)) FS.unlink(DEMO_MARKER);
  }
  async function fillStorage() {
    const sizes = measure();
    const total = Object.values(sizes).reduce((sum, s) => sum + s.bytes, 0);
    let summary = t('storageUsed') + size(total);
    const persist = document.getElementById('storage-persist');
    const persistRow = document.getElementById('storage-persist-row');
    if (navigator.storage && navigator.storage.estimate) {
      try { const estimate = await navigator.storage.estimate(); if (estimate.quota) summary += t('storageQuota') + size(estimate.quota) + '.'; } catch (e) {}
    }
    document.getElementById('storage-summary').textContent = summary;
    let persisted = false;
    try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false; } catch (e) {}
    persist.textContent = persisted ? t('persistOn') : t('persistOff');
    persistRow.style.display = persisted || !(navigator.storage && navigator.storage.persist) ? 'none' : '';

    const table = document.getElementById('storage-categories');
    table.replaceChildren();
    for (const key of [...CATEGORIES.map((c) => c.key), 'other']) {
      const s = sizes[key];
      if (key === 'other' && !s.files) continue;
      const row = table.insertRow();
      row.insertCell().textContent = t('cat_' + key);
      const count = row.insertCell(); count.className = 'size'; count.textContent = s.files + t('files');
      const bytes = row.insertCell(); bytes.className = 'size'; bytes.textContent = size(s.bytes);
      const act = row.insertCell(); act.className = 'act';
      if (s.files) {
        const b = document.createElement('button');
        b.className = 'btn small danger'; b.textContent = t('clear');
        b.onclick = () => {
          if (!confirm(t('confirmClear', t('cat_' + key)))) return;
          clearCategory(key);
          message('storage-messages', 'ok', t('cleared') + t('cat_' + key));
          const category = CATEGORIES.find((c) => c.key === key);
          if (category && category.reload) {
            message('storage-messages', 'info', t('reloading'));
            saveThen(() => location.reload());
          } else { save(); fillStorage(); }
        };
        act.appendChild(b);
      }
    }

    const roms = document.getElementById('storage-roms');
    roms.replaceChildren();
    for (const file of userRoms()) {
      const row = roms.insertRow();
      const name = row.insertCell(); name.className = 'name'; name.textContent = file;
      const bytes = row.insertCell(); bytes.className = 'size';
      try { bytes.textContent = size(FS.stat(ROMS + '/' + file).size); } catch (e) {}
      const act = row.insertCell(); act.className = 'act';
      const rename = document.createElement('button');
      rename.className = 'btn small'; rename.textContent = t('rename');
      rename.onclick = () => renameRom(file);
      const remove = document.createElement('button');
      remove.className = 'btn small danger'; remove.textContent = t('remove');
      remove.onclick = () => removeRom(file);
      act.append(rename, ' ', remove);
    }
    if (!roms.rows.length) { const row = roms.insertRow(); const c = row.insertCell(); c.className = 'empty'; c.textContent = t('romNone'); }
  }
  // The files that belong to a ROM: its states and their pictures, its cartridge saves and its
  // movies, all named `<ROM name without extension>.<something>` (user_data_paths.rs).
  function companions(file) {
    const stem = file.replace(/\.[^.]*$/, '');
    const found = [];
    for (const dir of ['saves', 'battery', 'movies']) {
      for (const name of list(DATA + '/' + dir)) {
        if (name.startsWith(stem + '.')) found.push({ dir, name, rest: name.slice(stem.length) });
      }
    }
    return { stem, found };
  }
  function renameRom(file) {
    const extension = (file.match(/\.[^.]*$/) || [''])[0];
    let wanted = prompt(t('renamePrompt', file), file.replace(/\.[^.]*$/, ''));
    if (wanted === null) return;
    wanted = safeName(wanted);
    if (!wanted) { message('storage-messages', 'error', t('badName') + file); return; }
    if (!ROM_FILE.test(wanted)) wanted += extension;
    if (wanted === file) return;
    if (exists(ROMS + '/' + wanted)) { message('storage-messages', 'error', t('exists') + wanted); return; }
    const { found } = companions(file);
    const newStem = wanted.replace(/\.[^.]*$/, '');
    FS.rename(ROMS + '/' + file, ROMS + '/' + wanted);
    for (const c of found) {
      const target = DATA + '/' + c.dir + '/' + newStem + c.rest;
      if (!exists(target)) FS.rename(DATA + '/' + c.dir + '/' + c.name, target);
    }
    message('storage-messages', 'ok', t('renamed') + file + ' → ' + wanted);
    save();
    fillStorage();
  }
  function removeRom(file) {
    if (!confirm(t('confirmRemove', file))) return;
    const { found } = companions(file);
    try { FS.unlink(ROMS + '/' + file); } catch (e) {}
    for (const c of found) { try { FS.unlink(DATA + '/' + c.dir + '/' + c.name); } catch (e) {} }
    message('storage-messages', 'ok', t('removed') + file);
    save();
    fillStorage();
  }
  document.getElementById('storage-persist-go').onclick = async () => {
    let granted = false;
    try { granted = await navigator.storage.persist(); } catch (e) {}
    if (!granted) message('storage-messages', 'info', t('persistRefused'));
    fillStorage();
  };
  document.getElementById('storage-all').onclick = () => {
    if (!confirm(t('confirmAll'))) return;
    for (const name of list(DATA)) removeTree(DATA + '/' + name);
    message('storage-messages', 'info', t('reloading'));
    saveThen(() => location.reload());
  };

  // The program's keys are the program's: Ctrl+O must not open the browser's own file dialogue,
  // Ctrl+S save the page, Tab move the focus, F1 open the help... (the program still gets them).
  window.addEventListener('keydown', (e) => {
    if (anyDialog()) return;
    // Tab and F1 open the console interface's menu: not the browser's focus move or help.
    const programKey = e.key === 'Tab' || /^F([1-9]|10)$/.test(e.key);
    if (programKey || ((e.ctrlKey || e.metaKey) && /^[a-z,]$/i.test(e.key))) {
      e.preventDefault();
    }
  }, true);

  // The program asks for a dialogue by writing its name in OPEN_REQUEST; it reports the imports.
  function pollRequests() {
    if (exists(OPEN_REQUEST)) {
      let wanted = 'rom';
      try { wanted = FS.readFile(OPEN_REQUEST, { encoding: 'utf8' }).trim() || 'rom'; FS.unlink(OPEN_REQUEST); } catch (e) {}
      if (wanted.startsWith('remote\n')) {
        const [, url, name, profile] = wanted.split('\n');
        // The game as its page listed it (its file name, extension included).
        const known = libraries().flatMap((l) => l.games).find((g) => g.url === (url || '').trim());
        const game = known || { url: (url || '').trim(), name: (name || 'game').trim() + '.nes' };
        if (game.url) playFromLibrary(game, (profile || '').trim() || null);
        return;
      }
      if (wanted === 'profile') clearMessages('profile-messages');
      showDialog(dialogs[wanted] ? wanted : 'rom');
    }
    takeImportResult();
    // The page's own buttons only while no game is on the screen.
    let state = '';
    try { state = FS.readFile(STATE, { encoding: 'utf8' }); } catch (e) {}
    document.body.classList.toggle('playing', state === 'playing');
  }

  // --- The address: ?import=<URL> (repeatable) imports 3D profiles or 3dSen data first;
  // ?profile=<identifier, title or URL> is the profile to play with; ?play=<URL or bundled
  // name> the ROM. ---
  async function startFromAddress() {
    const library = addressValues('library')[0];
    if (library && /^https?:\/\//i.test(library)) {
      if (!libraries().some((l) => l.url === library)) await addLibrary(library, true);
      else await importLibraryProfiles(library);
    }
    // The program's list shows the games of the pages added before.
    publishRemoteGames();
    const imports = addressValues('import');
    let profile = addressValues('profile')[0] || null;
    const remotes = [...imports];
    if (profile && /^https?:\/\//i.test(profile)) { remotes.push(profile); profile = null; }
    // Imported already from those addresses, their profiles unchanged: nothing to do (a reload).
    const profileUrl = addressValues('profile')[0];
    const fresh = remotes.filter((url) => !cachedImport(url));
    if (profile === null && profileUrl && /^https?:\/\//i.test(profileUrl) && !fresh.includes(profileUrl)) {
      profile = cachedImport(profileUrl).id || null;
    }
    if (fresh.length) {
      const win = progressWindow(t('progressImport'));
      const files = [];
      const errors = [];
      for (const url of fresh) {
        try { files.push(Object.assign(await downloadStep(win, url, 'profile'), { url })); } catch (e) { errors.push(e.message); }
      }
      if (files.length) {
        const before = profileSizes();
        const lines = (await importProfiles(files, win)) || [];
        // What each import made, remembered for a reload (one file per address here).
        const after = profileSizes();
        const made = {};
        for (const [name, bytes] of Object.entries(after)) if (before[name] !== bytes) made[name] = bytes;
        lines.forEach((line, index) => {
          if (line.ok && files[index]) {
            rememberDownload(files[index].url, { kind: 'import', id: line.id, count: line.count, files: files.length === 1 ? made : {} });
          }
        });
        // The profile given by its URL: the one that file became.
        const at = files.findIndex((f) => f.url === profileUrl);
        if (!profile && at >= 0 && lines[at] && lines[at].id) profile = lines[at].id;
        if (errors.length) message('profile-messages', 'error', errors.join(' ; '));
      } else {
        win.finish(false, errors.join(' ; '));
      }
    }
    wantedProfile = profile;
    const wanted = addressValues('play')[0] || '';
    if (/^https?:\/\//i.test(wanted)) {
      // Downloaded before and still there, unchanged: played without downloading it again.
      const cached = cachedRom(wanted);
      if (cached) { play(cached); return; }
      const win = progressWindow(t('progressRom'));
      try {
        const { name, bytes } = await downloadStep(win, wanted, 'rom');
        // Straight into the game: the window goes, unless an import above left its result.
        if (!fresh.length) win.close(); else win.finish(true, t('romReady') + name);
        const path = storeRom(name, bytes);
        rememberDownload(wanted, { kind: 'rom', path, size: bytes.length });
        play(path);
      } catch (e) { win.finish(false, e.message); }
      return;
    }
    // ?play=flappy (the README's link): straight into a bundled ROM, once the program has
    // installed it.
    const rom = wanted && BUNDLED.find((r) => r.title.toLowerCase().includes(wanted.toLowerCase()));
    const mine = !rom && wanted && userRoms().find((f) => f.toLowerCase().includes(wanted.toLowerCase()));
    const path = rom ? ROMS + '/' + rom.file : mine ? ROMS + '/' + mine : null;
    if (!path) { wantedProfile = null; return; }
    const tryOpen = (left) => {
      if (exists(path)) play(path);
      else if (left > 0) setTimeout(() => tryOpen(left - 1), 250);
    };
    setTimeout(() => tryOpen(40), 300);
  }

  var Module = {
    canvas,
    arguments: [],
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => { status.textContent = text; },
    onRuntimeInitialized: () => {
      status.textContent = '';
      applyLanguage();
      canvas.focus();
      setInterval(pollRequests, 200);
      startFromAddress();
    },
    preRun: [() => {
      // Debugging aid: ?env=NAME=value (repeatable) sets environment variables of the program.
      for (const pair of new URLSearchParams(location.search).getAll('env')) {
        const at = pair.indexOf('=');
        if (at > 0) ENV[pair.slice(0, at)] = pair.slice(at + 1);
      }
      // The user data folder from IndexedDB, before the program starts.
      FS.mkdirTree(DATA);
      FS.mount(Module.IDBFS || IDBFS, {}, DATA);
      addRunDependency('zaxnes-idbfs');
      FS.syncfs(true, (err) => {
        if (err) console.warn('Zaxnes: reading IndexedDB failed', err);
        removeRunDependency('zaxnes-idbfs');
      });
      // The interface's face (Roboto, Apache-2.0, as on Android): the program looks for the
      // system's faces and a page has none, so they are put where Android keeps them. Without
      // them the program falls back to its built-in face.
      FS.mkdirTree('/system/fonts');
      for (const face of ['Roboto-Regular.ttf', 'Roboto-Bold.ttf']) {
        const dependency = 'zaxnes-font-' + face;
        addRunDependency(dependency);
        fetch('fonts/' + face)
          .then((response) => (response.ok ? response.arrayBuffer() : Promise.reject(response.status)))
          .then((data) => FS.writeFile('/system/fonts/' + face, new Uint8Array(data)))
          .catch((err) => console.warn('Zaxnes: font ' + face + ' not loaded', err))
          .finally(() => removeRunDependency(dependency));
      }
    }],
  };
  window.addEventListener('error', (e) => { status.textContent = 'Erreur : ' + e.message; });
</script>
<script async src="zaxnes.js"></script>
</body>
</html>
