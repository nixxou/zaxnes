[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
# The handhelds are Cortex-A53 (Allwinner H700) or A55 (RK3566, runs A53 code): schedule and
# select instructions for it. No fast-math is involved, so the core's output is unchanged (the
# golden-core run under qemu-aarch64 is compared with the x86_64 goldens).
rustflags = ["-C", "target-cpu=cortex-a53"]

# Link the MSVC C runtime statically: no VCRUNTIME140.dll / UCRT redistributable needed next to
# zaxnes.exe. The C dependencies (SDL2, Lua, Dear ImGui) are built through the `cc` and `cmake`
# crates, which follow this flag (/MT).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
