[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# The PPU golden test runs 222 ROMs; the core is far too slow unoptimised.
[profile.test.package.zax-nes]
opt-level = 2

# Smaller, faster shipped binaries. Panics keep unwinding (the default): the interface and the
# script host report a failing hook instead of aborting. LTO does not change float results (no
# fast-math anywhere); the core goldens are re-run in release after a change here.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The libretro core (zax-libretro), a cdylib: cargo builds its dependencies to machine code rather
# than LTO bitcode, and rustc 1.99.1 crashes (access violation in LLVM) generating zax-engine3d's
# at opt-level 3. cargo build --profile libretro -p zax-libretro.
[profile.libretro]
inherits = "release"

[profile.libretro.package.zax-engine3d]
opt-level = 2

# librashader-runtime-wgpu with the naga module handed to wgpu directly (Mega Bezel), see
# vendor/librashader-runtime-wgpu/README.md.
[patch.crates-io]
librashader-runtime-wgpu = { path = "vendor/librashader-runtime-wgpu" }
